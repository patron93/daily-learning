<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, sans-serif" role="img" aria-label="Пути тока через тело">
  <rect width="760" height="360" rx="12" fill="#f8fafc"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#0f172a">Путь тока решает, сколько достанется сердцу</text>
  <!-- figure 1: hand to feet -->
  <g stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="160" cy="80" r="20" fill="#fde68a"/>
    <line x1="160" y1="100" x2="160" y2="210"/>
    <line x1="160" y1="120" x2="110" y2="170"/><line x1="160" y1="120" x2="210" y2="90"/>
    <line x1="160" y1="210" x2="130" y2="290"/><line x1="160" y1="210" x2="190" y2="290"/>
  </g>
  <path d="M150 150 q4 -6 8 0 q4 6 8 0" stroke="#dc2626" stroke-width="3" fill="#fecaca"/>
  <rect x="200" y="70" width="40" height="14" fill="#b91c1c"/><text x="245" y="82" font-size="12" fill="#b91c1c">L</text>
  <path id="p1" d="M210 90 L160 120 L158 150 L160 210 L130 290" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <circle r="5" fill="#dc2626"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <line x1="60" y1="295" x2="260" y2="295" stroke="#78716c" stroke-width="4"/>
  <text x="160" y="318" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">рука → ноги</text>
  <text x="160" y="338" text-anchor="middle" font-size="12" fill="#b91c1c">через сердце, коэф. 0,8–1,0</text>
  <!-- figure 2: hand to hand -->
  <g stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="460" cy="80" r="20" fill="#fde68a"/>
    <line x1="460" y1="100" x2="460" y2="210"/>
    <line x1="460" y1="120" x2="400" y2="120"/><line x1="460" y1="120" x2="520" y2="120"/>
    <line x1="460" y1="210" x2="430" y2="290"/><line x1="460" y1="210" x2="490" y2="290"/>
  </g>
  <path d="M450 150 q4 -6 8 0 q4 6 8 0" stroke="#dc2626" stroke-width="3" fill="#fecaca"/>
  <rect x="515" y="110" width="40" height="14" fill="#b91c1c"/><text x="560" y="122" font-size="12" fill="#b91c1c">L</text>
  <rect x="360" y="100" width="14" height="60" fill="#94a3b8"/><text x="330" y="180" font-size="12" fill="#475569">кран / труба</text>
  <path id="p2" d="M520 120 L460 125 L400 120 L374 120" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <circle r="5" fill="#dc2626"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <line x1="360" y1="295" x2="560" y2="295" stroke="#78716c" stroke-width="4"/>
  <text x="460" y="318" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="bold">рука → рука</text>
  <text x="460" y="338" text-anchor="middle" font-size="12" fill="#b45309">коэф. 0,4 — меньше, но не безопасно</text>
  <!-- note -->
  <rect x="590" y="70" width="155" height="170" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="667" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Опаснее всего</text>
  <text x="667" y="114" text-anchor="middle" font-size="12" fill="#475569">грудь → левая рука</text>
  <text x="667" y="132" text-anchor="middle" font-size="12" fill="#b91c1c">коэф. 1,5</text>
  <text x="667" y="164" text-anchor="middle" font-size="12" fill="#475569">Земля, пол, кран,</text>
  <text x="667" y="182" text-anchor="middle" font-size="12" fill="#475569">батарея — тоже</text>
  <text x="667" y="200" text-anchor="middle" font-size="12" fill="#475569">«второй провод»</text>
  <text x="667" y="226" text-anchor="middle" font-size="11" fill="#64748b">по IEC 60479-1</text>
</svg>
