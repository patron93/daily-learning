<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Arial, sans-serif">
<rect width="720" height="330" fill="#fffdf7" rx="16"/>
<text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Кто что делает: от сети до розетки</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#374151"/></marker></defs>
<g font-size="13" text-anchor="middle">
<rect x="20" y="60" width="200" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="120" y="90" font-weight="bold" font-size="15" fill="#7f1d1d">Złącze · licznik</text>
<text x="120" y="112" fill="#7f1d1d">пломбы, предохранитель</text>
<line x1="220" y1="95" x2="256" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<rect x="260" y="60" width="200" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="360" y="90" font-weight="bold" font-size="15" fill="#78350f">Rozdzielnica (щит)</text>
<text x="360" y="112" fill="#78350f">автоматы, УЗО, подключение</text>
<line x1="460" y1="95" x2="496" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="60" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="600" y="90" font-weight="bold" font-size="15" fill="#14532d">Линии по квартире</text>
<text x="600" y="112" fill="#14532d">кабели, гофра, коробки</text>
<rect x="20" y="150" width="200" height="110" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="120" y="178" font-weight="bold" fill="#7f1d1d">🚫 Только OSD</text>
<text x="120" y="202" fill="#111827">не открывать,</text>
<text x="120" y="222" fill="#111827">не менять, мощность —</text>
<text x="120" y="242" fill="#111827">через заявку</text>
<rect x="260" y="150" width="200" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
<text x="360" y="178" font-weight="bold" fill="#78350f">🔧 Электрик SEP G1 E</text>
<text x="360" y="202" fill="#111827">подключение, ввод в работу,</text>
<text x="360" y="222" fill="#111827">pomiary + protokół</text>
<text x="360" y="242" fill="#111827">(ты можешь готовить)</text>
<rect x="500" y="150" width="200" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="600" y="178" font-weight="bold" fill="#14532d">✅ Владелец может</text>
<text x="600" y="202" fill="#111827">план, покупка, штробы,</text>
<text x="600" y="222" fill="#111827">прокладка на обесточенном</text>
<text x="600" y="242" fill="#111827">— с проверкой электрика</text>
</g>
<text x="360" y="300" text-anchor="middle" font-size="13" fill="#374151">Проект электрики нового дома — проектант с uprawnienia budowlane (это не SEP)</text>
</svg>
