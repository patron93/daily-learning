  <rect x="30" y="378" width="740" height="76" rx="10" fill="#fff4e0" stroke="#d48a00"/>
  <text x="50" y="402" font-size="13.5" fill="#7a4d00">Читаем сверху вниз: WLZ → Q1 (выключатель) → SPD на PE → три УЗО → автоматы линий → кабель и приёмник.</text>
  <text x="50" y="422" font-size="13.5" fill="#7a4d00">Проверки: свет F1 и F2 под разными УЗО · под каждым УЗО разные фазы · B10 ↔ 1,5 мм², B16 ↔ 2,5 мм².</text>
  <text x="50" y="442" font-size="13.5" fill="#7a4d00">Опущены для места: F5, F7–F9, F11 (розетки прихожей, кухня №2, холодильник, духовка, посудомойка).</text>
