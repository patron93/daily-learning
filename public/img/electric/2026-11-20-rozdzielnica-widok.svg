<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Arial, sans-serif">
  <rect width="780" height="520" fill="#fbfaf6" rx="12"/>
  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Щит квартиры без крышки: что внутри</text>
  <!-- enclosure -->
  <rect x="140" y="50" width="500" height="430" rx="14" fill="#eceff1" stroke="#607d8b" stroke-width="3"/>
  <!-- row 1 -->
  <rect x="160" y="96" width="460" height="10" fill="#b0bec5"/>
  <g stroke="#555" stroke-width="1">
    <rect x="175" y="72" width="54" height="58" rx="4" fill="#c62828"/>
    <rect x="235" y="72" width="72" height="58" rx="4" fill="#fff" />
    <rect x="313" y="72" width="18" height="58" rx="3" fill="#fff9c4"/>
    <rect x="337" y="72" width="72" height="58" rx="4" fill="#e3f2fd"/>
    <rect x="415" y="72" width="72" height="58" rx="4" fill="#e3f2fd"/>
  </g>
  <text x="202" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">0/I</text>
  <text x="271" y="106" text-anchor="middle" font-size="11" fill="#333">SPD</text>
  <text x="322" y="106" text-anchor="middle" font-size="9" fill="#333">●</text>
  <text x="373" y="106" text-anchor="middle" font-size="11" fill="#1f5fa8">RCD 1</text>
  <text x="451" y="106" text-anchor="middle" font-size="11" fill="#1f5fa8">RCD 2</text>
  <!-- row 2 MCBs -->
  <rect x="160" y="196" width="460" height="10" fill="#b0bec5"/>
  <g stroke="#555" stroke-width="1" fill="#fff">
    <rect x="175" y="172" width="17" height="58" rx="2"/><rect x="194" y="172" width="17" height="58" rx="2"/><rect x="213" y="172" width="17" height="58" rx="2"/><rect x="232" y="172" width="17" height="58" rx="2"/><rect x="251" y="172" width="17" height="58" rx="2"/><rect x="270" y="172" width="17" height="58" rx="2"/>
    <rect x="300" y="172" width="17" height="58" rx="2"/><rect x="319" y="172" width="17" height="58" rx="2"/><rect x="338" y="172" width="17" height="58" rx="2"/><rect x="357" y="172" width="17" height="58" rx="2"/><rect x="376" y="172" width="51" height="58" rx="2"/>
  </g>
  <rect x="175" y="164" width="112" height="6" fill="#ff8f00"/>
  <rect x="300" y="164" width="127" height="6" fill="#ff8f00"/>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#333">MCB: B10 свет, B16 розетки, C16 кухня… (3P для плиты)</text>
  <text x="530" y="205" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">резерв</text>
  <rect x="440" y="172" width="170" height="58" rx="4" fill="none" stroke="#2e7d32" stroke-dasharray="5 4"/>
  <!-- bars -->
  <rect x="175" y="300" width="190" height="20" rx="3" fill="#1e88e5"/>
  <text x="270" y="315" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">N — группа RCD 1</text>
  <rect x="380" y="300" width="190" height="20" rx="3" fill="#1e88e5"/>
  <text x="475" y="315" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">N — группа RCD 2</text>
  <rect x="175" y="345" width="395" height="20" rx="3" fill="#7cb342" stroke="#fdd835" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="372" y="360" text-anchor="middle" font-size="12" fill="#1b1b1b" font-weight="bold">PE — общая шина защиты</text>
  <!-- cable entry -->
  <rect x="330" y="440" width="120" height="30" rx="6" fill="#455a64"/>
  <text x="390" y="460" text-anchor="middle" font-size="12" fill="#fff">ввод WLZ (кабель)</text>
  <!-- callouts left -->
  <g font-size="12" fill="#333">
    <text x="10" y="80" font-weight="bold">1 Вводной</text><text x="10" y="96">выключатель</text><text x="10" y="112">(rozłącznik)</text>
    <line x1="95" y1="92" x2="173" y2="96" stroke="#888"/>
    <text x="10" y="190" font-weight="bold">4 Гребёнка</text><text x="10" y="206">(szyna</text><text x="10" y="222">grzebieniowa)</text>
    <line x1="95" y1="200" x2="173" y2="168" stroke="#888"/>
    <text x="10" y="300" font-weight="bold">5 Шины N</text><text x="10" y="316">отдельно на</text><text x="10" y="332">каждое RCD</text>
    <line x1="85" y1="312" x2="173" y2="310" stroke="#888"/>
    <text x="10" y="390" font-weight="bold">6 Шина PE</text>
    <line x1="80" y1="386" x2="173" y2="358" stroke="#888"/>
  </g>
  <!-- callouts right -->
  <g font-size="12" fill="#333">
    <text x="655" y="70" font-weight="bold">2 SPD — защита</text><text x="655" y="86">от перенапряжений</text>
    <line x1="653" y1="78" x2="300" y2="74" stroke="#888"/>
    <text x="655" y="118" font-weight="bold">3 RCD (УЗО)</text><text x="655" y="134">40 A / 30 мА</text>
    <line x1="653" y1="122" x2="488" y2="108" stroke="#888"/>
    <text x="655" y="290" font-weight="bold">DIN-рейка TH35</text><text x="655" y="306">35 мм, 1 модуль</text><text x="655" y="322">= 17,5 мм</text>
    <line x1="653" y1="298" x2="620" y2="202" stroke="#888"/>
  </g>
  <text x="390" y="505" text-anchor="middle" font-size="13" fill="#555">Сверху вниз по пути тока: ввод → rozłącznik → SPD → RCD → гребёнка → MCB → линии</text>
</svg>
