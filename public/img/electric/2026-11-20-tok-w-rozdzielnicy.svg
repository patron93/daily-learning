<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Arial, sans-serif">
  <rect width="780" height="360" fill="#fbfaf6" rx="12"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8d6e63"/></marker></defs>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Путь тока через щит (одна фаза, упрощённо)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="80" width="100" height="60" rx="8" fill="#455a64"/><text x="70" y="106" fill="#fff">WLZ</text><text x="70" y="124" fill="#cfd8dc" font-size="11">от счётчика</text>
    <rect x="150" y="80" width="100" height="60" rx="8" fill="#ffcdd2" stroke="#c62828"/><text x="200" y="106" fill="#c62828" font-weight="bold">Rozłącznik</text><text x="200" y="124" font-size="11">вкл/выкл всё</text>
    <rect x="280" y="80" width="100" height="60" rx="8" fill="#fff" stroke="#555"/><text x="330" y="106" font-weight="bold">SPD</text><text x="330" y="124" font-size="11">сбрасывает импульс</text>
    <rect x="410" y="80" width="100" height="60" rx="8" fill="#e3f2fd" stroke="#1f5fa8"/><text x="460" y="106" fill="#1f5fa8" font-weight="bold">RCD</text><text x="460" y="124" font-size="11">сравнивает L и N</text>
    <rect x="540" y="60" width="100" height="40" rx="8" fill="#fff" stroke="#555"/><text x="590" y="85">MCB B10</text>
    <rect x="540" y="110" width="100" height="40" rx="8" fill="#fff" stroke="#555"/><text x="590" y="135">MCB B16</text>
    <rect x="670" y="60" width="90" height="40" rx="8" fill="#fff8e1" stroke="#ff8f00"/><text x="715" y="85">свет</text>
    <rect x="670" y="110" width="90" height="40" rx="8" fill="#fff8e1" stroke="#ff8f00"/><text x="715" y="135">розетки</text>
  </g>
  <g stroke="#8d6e63" stroke-width="3" fill="none">
    <line x1="120" y1="110" x2="148" y2="110" marker-end="url(#ar)"/>
    <line x1="250" y1="110" x2="278" y2="110" marker-end="url(#ar)"/>
    <line x1="380" y1="110" x2="408" y2="110" marker-end="url(#ar)"/>
    <path d="M510,110 L525,110 L525,80 L538,80" marker-end="url(#ar)"/>
    <path d="M525,110 L525,130 L538,130" marker-end="url(#ar)"/>
    <line x1="640" y1="80" x2="668" y2="80" marker-end="url(#ar)"/>
    <line x1="640" y1="130" x2="668" y2="130" marker-end="url(#ar)"/>
  </g>
  <text x="590" y="174" text-anchor="middle" font-size="11" fill="#ff8f00">через гребёнку</text>
  <!-- N return -->
  <path d="M760,150 L760,215 L470,215" stroke="#1e88e5" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="615" y="208" text-anchor="middle" font-size="12" fill="#1e88e5">N линий → своя шина N → обратно в RCD</text>
  <line x1="460" y1="215" x2="460" y2="142" stroke="#1e88e5" stroke-width="3"/>
  <!-- PE -->
  <path d="M70,140 L70,270 L760,270" stroke="#7cb342" stroke-width="3" fill="none" stroke-dasharray="10 6"/>
  <text x="400" y="262" text-anchor="middle" font-size="12" fill="#558b2f">PE идёт мимо всех аппаратов прямо на шину PE и дальше к корпусам приборов (и к SPD)</text>
  <text x="390" y="310" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">Ошибка: N линии из группы RCD 1 подключён к шине N группы RCD 2</text>
  <text x="390" y="332" text-anchor="middle" font-size="12" fill="#555">→ RCD видит «утечку» (ток ушёл по L одного, вернулся через другое) и выбивает без причины</text>
</svg>
