<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Arial, sans-serif">
<rect width="800" height="380" fill="#fffdf7" rx="16"/>
<text x="400" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Падение напряжения на линии при 16 А: ΔU = I × 0,0175 × 2L / S</text>
<g font-size="14">
  <!-- axis -->
  <line x1="200" y1="300" x2="760" y2="300" stroke="#374151"/>
  <line x1="200" y1="70" x2="200" y2="300" stroke="#374151"/>
  <!-- 3% line: scale 140 px per 1% -> 3% at x=200+420=620 -->
  <line x1="620" y1="60" x2="620" y2="305" stroke="#dc2626" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="620" y="322" text-anchor="middle" fill="#dc2626" font-weight="bold">3 %</text>
  <text x="200" y="322" text-anchor="middle" fill="#374151">0</text>
  <text x="340" y="322" text-anchor="middle" fill="#374151">1 %</text>
  <text x="480" y="322" text-anchor="middle" fill="#374151">2 %</text>

  <text x="190" y="105" text-anchor="end" fill="#111827">15 м, 2,5 мм²</text>
  <rect x="200" y="88" width="210" height="26" rx="4" fill="#22c55e"/>
  <text x="418" y="106" fill="#14532d">3,36 В · 1,5 % ✔</text>

  <text x="190" y="160" text-anchor="end" fill="#111827">35 м, 2,5 мм²</text>
  <rect x="200" y="143" width="476" height="26" rx="4" fill="#ef4444"/>
  <text x="684" y="161" fill="#7f1d1d">7,84 В · 3,4 % ✘</text>

  <text x="190" y="215" text-anchor="end" fill="#111827">35 м, 4 мм²</text>
  <rect x="200" y="198" width="294" height="26" rx="4" fill="#22c55e"/>
  <text x="502" y="216" fill="#14532d">4,9 В · 2,1 % ✔</text>

  <text x="190" y="270" text-anchor="end" fill="#111827">LED 2 А, 20 м, 1,5</text>
  <rect x="200" y="253" width="56" height="26" rx="4" fill="#22c55e"/>
  <text x="264" y="271" fill="#14532d">0,93 В · 0,4 % ✔</text>
</g>
<text x="400" y="355" text-anchor="middle" font-size="13" fill="#6b7280">2L — путь тока туда (фаза) и обратно (ноль); ориентир — не больше 3 % от счётчика до приёмника</text>
</svg>
