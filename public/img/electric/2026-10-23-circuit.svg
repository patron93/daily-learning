<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="system-ui,sans-serif">
  <rect width="640" height="340" rx="14" fill="#f6f8fa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">Замкнутая цепь: заряды ходят по кругу</text>
  <!-- провода -->
  <path id="loop" d="M120 90 H520 V250 H120 Z" fill="none" stroke="#57606a" stroke-width="5"/>
  <!-- батарейка (источник) -->
  <rect x="96" y="150" width="48" height="40" rx="6" fill="#f6f8fa"/>
  <line x1="104" y1="158" x2="136" y2="158" stroke="#cf222e" stroke-width="5"/>
  <line x1="112" y1="182" x2="128" y2="182" stroke="#0969da" stroke-width="5"/>
  <text x="70" y="164" text-anchor="end" font-size="15" fill="#cf222e" font-weight="700">+</text>
  <text x="70" y="190" text-anchor="end" font-size="15" fill="#0969da" font-weight="700">−</text>
  <text x="120" y="290" text-anchor="middle" font-size="14" fill="#24292f">Источник (źródło)</text>
  <!-- лампа (нагрузка) -->
  <circle cx="520" cy="170" r="30" fill="#fff8c5" stroke="#bf8700" stroke-width="3">
    <animate attributeName="fill" values="#fff8c5;#ffe066;#fff8c5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M505 182 L512 160 L520 182 L528 160 L535 182" fill="none" stroke="#bf8700" stroke-width="3"/>
  <text x="520" y="290" text-anchor="middle" font-size="14" fill="#24292f">Нагрузка (odbiornik)</text>
  <!-- выключатель -->
  <rect x="290" y="70" width="60" height="40" fill="#f6f8fa"/>
  <circle cx="295" cy="90" r="5" fill="#24292f"/>
  <circle cx="345" cy="90" r="5" fill="#24292f"/>
  <line x1="295" y1="90" x2="343" y2="90" stroke="#1a7f37" stroke-width="5"/>
  <text x="320" y="60" text-anchor="middle" font-size="14" fill="#24292f">Выключатель замкнут</text>
  <!-- подписи проводов -->
  <text x="320" y="278" text-anchor="middle" font-size="13" fill="#57606a">провод «обратно»</text>
  <text x="440" y="82" font-size="13" fill="#57606a">провод «туда»</text>
  <!-- бегущие заряды -->
  <g fill="#0969da">
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" begin="0s"><mpath href="#loop"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" begin="-1s"><mpath href="#loop"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" begin="-2s"><mpath href="#loop"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" begin="-3s"><mpath href="#loop"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" begin="-4s"><mpath href="#loop"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" begin="-5s"><mpath href="#loop"/></animateMotion></circle>
  </g>
  <text x="320" y="325" text-anchor="middle" font-size="13" fill="#57606a">Синие точки — заряды. Сколько вошло в лампу, столько и вышло: лампа забирает энергию, а не заряды.</text>
</svg>
