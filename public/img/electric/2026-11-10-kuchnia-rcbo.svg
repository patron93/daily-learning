<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif">
<rect width="760" height="400" fill="#f8fafc" rx="16"/>
<text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Фрагмент щита: кухня на RCBO (автомат + УЗО в одном модуле)</text>
<rect x="40" y="56" width="680" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
<text x="380" y="78" text-anchor="middle" font-size="13" fill="#334155">L / N после главного выключателя (rozłącznik główny) и SPD</text>
<g font-size="12" text-anchor="middle">
<!-- three RCBO -->
<g>
<line x1="160" y1="90" x2="160" y2="120" stroke="#b45309" stroke-width="3"/>
<rect x="110" y="120" width="100" height="110" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="160" y="146" font-weight="bold" fill="#0f172a">RCBO</text>
<text x="160" y="168" fill="#0f172a">B16</text>
<text x="160" y="188" fill="#0f172a">30 мА · тип A</text>
<rect x="148" y="198" width="24" height="18" rx="3" fill="#2563eb"/>
<text x="160" y="212" font-size="9" fill="#ffffff">T</text>
<line x1="160" y1="230" x2="160" y2="280" stroke="#b45309" stroke-width="3"/>
<rect x="95" y="280" width="130" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
<text x="160" y="304" font-weight="bold" fill="#14532d">K1 · zmywarka</text>
<text x="160" y="324" fill="#14532d">YDYp 3×2,5</text>
</g>
<g>
<line x1="380" y1="90" x2="380" y2="120" stroke="#b45309" stroke-width="3"/>
<rect x="330" y="120" width="100" height="110" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="380" y="146" font-weight="bold" fill="#0f172a">RCBO</text>
<text x="380" y="168" fill="#0f172a">B16</text>
<text x="380" y="188" fill="#0f172a">30 мА · тип A</text>
<rect x="368" y="198" width="24" height="18" rx="3" fill="#2563eb"/>
<text x="380" y="212" font-size="9" fill="#ffffff">T</text>
<line x1="380" y1="230" x2="380" y2="280" stroke="#b45309" stroke-width="3"/>
<rect x="315" y="280" width="130" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
<text x="380" y="304" font-weight="bold" fill="#14532d">K2 · blat lewy</text>
<text x="380" y="324" fill="#14532d">YDYp 3×2,5</text>
</g>
<g>
<line x1="600" y1="90" x2="600" y2="120" stroke="#b45309" stroke-width="3"/>
<rect x="550" y="120" width="100" height="110" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="600" y="146" font-weight="bold" fill="#0f172a">RCBO</text>
<text x="600" y="168" fill="#0f172a">B16</text>
<text x="600" y="188" fill="#0f172a">30 мА · тип A</text>
<rect x="588" y="198" width="24" height="18" rx="3" fill="#2563eb"/>
<text x="600" y="212" font-size="9" fill="#ffffff">T</text>
<line x1="600" y1="230" x2="600" y2="280" stroke="#b45309" stroke-width="3"/>
<rect x="535" y="280" width="130" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
<text x="600" y="304" font-weight="bold" fill="#14532d">K3 · blat prawy</text>
<text x="600" y="324" fill="#14532d">YDYp 3×2,5</text>
</g>
</g>
<text x="380" y="368" text-anchor="middle" font-size="12" fill="#334155">T — кнопка теста УЗО: нажимать раз в полгода. Утечка в посудомойке отключит только K1,</text>
<text x="380" y="386" text-anchor="middle" font-size="12" fill="#334155">а холодильник и розетки столешницы продолжат работать.</text>
</svg>
