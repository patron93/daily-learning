<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
<rect width="760" height="420" fill="#ffffff" rx="16"/>
<text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Типы УЗО: каждый следующий видит всё, что предыдущий, и ещё больше</text>
<rect x="20" y="50" width="720" height="350" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="40" y="76" font-size="16" font-weight="bold" fill="#b91c1c">B — + гладкая постоянная утечка, высокие частоты</text>
<text x="40" y="96" font-size="12" fill="#7f1d1d">зарядка EV без защиты DC 6 мА, трёхфазный частотник, PV-инвертор — если требует производитель</text>
<rect x="40" y="110" width="680" height="275" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
<text x="60" y="136" font-size="16" font-weight="bold" fill="#7e22ce">F — + смесь частот, постоянная до 10 мА</text>
<text x="60" y="156" font-size="12" fill="#581c87">инверторная стиральная машина, кондиционер, тепловой насос 230 В</text>
<rect x="60" y="170" width="640" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="80" y="196" font-size="16" font-weight="bold" fill="#1d4ed8">A — + пульсирующая постоянная, гладкая до 6 мА</text>
<text x="80" y="216" font-size="12" fill="#1e3a8a">стандарт для квартиры и дома: розетки, свет, кухня, зарядки, LED</text>
<rect x="80" y="232" width="300" height="120" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="100" y="258" font-size="16" font-weight="bold" fill="#334155">AC — только синусоида</text>
<text x="100" y="278" font-size="12" fill="#475569">для современной техники мало,</text>
<text x="100" y="294" font-size="12" fill="#475569">в новых щитах не ставят</text>
<path d="M100,325 q15,-25 30,0 t30,0 t30,0 t30,0" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M420,325 q15,-30 30,0 l30,0 q15,-30 30,0 l30,0" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="420" y="345" font-size="11" fill="#1e3a8a">полуволны (выпрямитель)</text>
<rect x="420" y="246" width="260" height="56" rx="8" fill="#fff7ed" stroke="#ea580c"/>
<text x="550" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">⚠ гладкий DC &gt; 6 мА «ослепляет» тип A:</text>
<text x="550" y="288" text-anchor="middle" font-size="12" fill="#c2410c">оно перестаёт видеть любую утечку</text>
</svg>
