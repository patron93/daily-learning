<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Arial, sans-serif">
<rect width="780" height="340" fill="#ffffff" rx="16"/>
<text x="390" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Выключатель: 3 × 1,5 żo, синий работает как фаза</text>
<!-- box -->
<rect x="40" y="70" width="170" height="200" rx="12" fill="#f3f4f6" stroke="#6b7280"/>
<text x="125" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">распаечная коробка</text>
<text x="60" y="130" font-size="13" fill="#92400e" font-weight="bold">L от щита</text>
<text x="60" y="190" font-size="13" fill="#2563eb" font-weight="bold">N от щита</text>
<text x="60" y="245" font-size="13" fill="#15803d" font-weight="bold">PE</text>
<!-- switch -->
<rect x="560" y="70" width="170" height="130" rx="12" fill="#f3f4f6" stroke="#6b7280"/>
<text x="645" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">выключатель</text>
<circle cx="600" cy="125" r="6" fill="#374151"/><circle cx="690" cy="125" r="6" fill="#374151"/>
<line x1="600" y1="125" x2="680" y2="105" stroke="#374151" stroke-width="3"><animateTransform attributeName="transform" type="rotate" values="0 600 125;14 600 125;0 600 125" dur="3s" repeatCount="indefinite"/></line>
<text x="600" y="150" text-anchor="middle" font-size="11" fill="#374151">L</text><text x="690" y="150" text-anchor="middle" font-size="11" fill="#374151">↑ выход</text>
<!-- wires -->
<line x1="150" y1="125" x2="594" y2="125" stroke="#92400e" stroke-width="6"/>
<text x="370" y="116" text-anchor="middle" font-size="12" fill="#92400e">коричневый: фаза туда</text>
<path d="M690 131 L690 165 L150 165" fill="none" stroke="#2563eb" stroke-width="6"/>
<rect x="170" y="159" width="30" height="12" fill="#92400e"/><rect x="650" y="159" width="30" height="12" fill="#92400e"/>
<text x="420" y="185" text-anchor="middle" font-size="12" fill="#2563eb">синий = фаза с выключателя, коричневая термоусадка на обоих концах</text>
<line x1="150" y1="240" x2="560" y2="240" stroke="#16a34a" stroke-width="6" stroke-dasharray="10 6"/>
<text x="370" y="232" text-anchor="middle" font-size="12" fill="#15803d">жёлто-зелёный: только PE (в выключателе изолирован)</text>
<!-- lamp -->
<circle cx="125" cy="305" r="18" fill="#fde68a" stroke="#b45309"/>
<text x="160" y="310" font-size="12" fill="#374151">лампа: фаза с выключателя + N от щита + PE</text>
<text x="560" y="250" font-size="12" fill="#b91c1c" font-weight="bold" dx="10">✘ ЖЗ как фаза — нельзя</text>
<text x="560" y="285" font-size="12" fill="#374151">Для умного реле в подрозетнике</text>
<text x="560" y="302" font-size="12" fill="#374151">нужен ещё и ноль → 4 × 1,5 żo</text>
</svg>
