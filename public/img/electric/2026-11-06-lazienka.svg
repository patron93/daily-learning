<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Arial, sans-serif">
<rect width="780" height="400" fill="#fffdf7" rx="16"/>
<text x="390" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Пробой на корпус стиралки: что почувствует человек</text>
<rect x="20" y="55" width="360" height="300" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="200" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">Без местного уравнивания</text>
<rect x="400" y="55" width="360" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="580" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">С местным уравниванием</text>
<g id="scene">
<rect x="50" y="140" width="90" height="110" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
<circle cx="95" cy="190" r="26" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<text x="95" y="270" text-anchor="middle" font-size="12" fill="#111827">корпус</text>
<rect x="260" y="110" width="12" height="190" fill="#9ca3af" stroke="#4b5563"/>
<rect x="230" y="120" width="40" height="12" fill="#9ca3af" stroke="#4b5563"/>
<text x="266" y="320" text-anchor="middle" font-size="12" fill="#111827">труба → земля</text>
<circle cx="190" cy="140" r="14" fill="#fcd34d" stroke="#92400e"/>
<line x1="190" y1="154" x2="190" y2="215" stroke="#92400e" stroke-width="5"/>
<line x1="190" y1="170" x2="140" y2="180" stroke="#92400e" stroke-width="4"/>
<line x1="190" y1="170" x2="240" y2="130" stroke="#92400e" stroke-width="4"/>
<line x1="190" y1="215" x2="175" y2="265" stroke="#92400e" stroke-width="4"/>
<line x1="190" y1="215" x2="205" y2="265" stroke="#92400e" stroke-width="4"/>
</g>
<text x="95" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">≈ 115 В</text>
<text x="300" y="150" font-size="13" font-weight="bold" fill="#2563eb">0 В</text>
<path d="M140 180 Q190 160 240 130" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4">
<animate attributeName="stroke-dashoffset" from="18" to="0" dur="0.6s" repeatCount="indefinite"/>
</path>
<text x="200" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">через тело: ~115 В — смертельно опасно</text>
<use href="#scene" x="380"/>
<text x="475" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">≈ 115 В</text>
<text x="680" y="150" font-size="13" font-weight="bold" fill="#dc2626">≈ 100 В</text>
<path d="M475 250 L475 290 L646 290 L646 280" fill="none" stroke="#16a34a" stroke-width="4"/>
<path d="M475 250 L475 290 L646 290 L646 280" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="6 6"/>
<text x="560" y="284" text-anchor="middle" font-size="11" fill="#15803d">PE / провод 4 мм²</text>
<text x="580" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">разница ~15 В, пока УЗО/автомат отключает</text>
<text x="390" y="385" text-anchor="middle" font-size="12" fill="#4b5563">Упрощённый расчёт из урока: ток аварии ≈ 290 А, цифры иллюстративные</text>
</svg>
