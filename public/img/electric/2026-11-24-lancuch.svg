<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="780" height="400" rx="14" fill="#fbfbf8"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Цепочка номиналов: что с чем сравнивать</text>
  <g font-size="14" fill="#222">
    <rect x="40" y="55" width="240" height="56" rx="10" fill="#eee" stroke="#888"/>
    <text x="160" y="78" text-anchor="middle" font-weight="700">przedlicznikowe C25</text>
    <text x="160" y="98" text-anchor="middle" font-size="12" fill="#555">зона OSD · защищает WLZ</text>

    <rect x="40" y="135" width="240" height="56" rx="10" fill="#fff3d9" stroke="#c19a3a"/>
    <text x="160" y="158" text-anchor="middle" font-weight="700">Rozłącznik 40 A</text>
    <text x="160" y="178" text-anchor="middle" font-size="12" fill="#555">не защищает · 40 ≥ 25 ✔</text>

    <rect x="40" y="215" width="240" height="56" rx="10" fill="#e3effd" stroke="#4a7fc1"/>
    <text x="160" y="238" text-anchor="middle" font-weight="700">УЗО 40 A / 30 mA</text>
    <text x="160" y="258" text-anchor="middle" font-size="12" fill="#555">не защищает от перегрузки · 40 ≥ 25 ✔</text>
  </g>
  <g stroke="#333" stroke-width="2.5" fill="none">
    <line x1="160" y1="111" x2="160" y2="135"/>
    <line x1="160" y1="191" x2="160" y2="215"/>
    <line x1="160" y1="271" x2="160" y2="300"/>
    <line x1="80" y1="300" x2="240" y2="300"/>
    <line x1="80" y1="300" x2="80" y2="320"/><line x1="160" y1="300" x2="160" y2="320"/><line x1="240" y1="300" x2="240" y2="320"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <rect x="50" y="320" width="60" height="32" rx="6" fill="#c8e8c8" stroke="#4a9a4a"/><text x="80" y="341">B10</text>
    <rect x="130" y="320" width="60" height="32" rx="6" fill="#c8e8c8" stroke="#4a9a4a"/><text x="160" y="341">B16</text>
    <rect x="210" y="320" width="60" height="32" rx="6" fill="#c8e8c8" stroke="#4a9a4a"/><text x="240" y="341">B20</text>
    <text x="80" y="372" font-size="12">3×1,5</text><text x="160" y="372" font-size="12">3×2,5</text><text x="240" y="372" font-size="12">3×4</text>
  </g>
  <g font-size="14" fill="#222">
    <text x="320" y="80" font-weight="700">Проверки</text>
    <text x="320" y="108">1. Каждая линия: I_B ≤ I_n ≤ I_z (с поправками на пучок)</text>
    <text x="320" y="136">2. Аппарат без защиты (rozłącznik, УЗО):</text>
    <text x="340" y="156">номинал ≥ защиты перед ним</text>
    <text x="320" y="184">3. Отключающая способность ≥ тока КЗ: берём 6 кА</text>
    <text x="320" y="212">4. Петля КЗ: B16 — нужен ток КЗ ≥ 80 A, C16 — ≥ 160 A</text>
    <text x="320" y="240">5. Сечение уменьшилось → новая защита на месте</text>
    <text x="340" y="260">(подщит гаража: 6 мм² от B32 → там B16 на 2,5 мм²)</text>
    <text x="320" y="288">6. Селективность: перегрузка — да,</text>
    <text x="340" y="308">сильное КЗ — по таблицам производителя</text>
  </g>
</svg>
