<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
<rect width="760" height="420" fill="#ffffff" rx="16"/>
<text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Зоны ванной: вид сбоку (ванна у стены)</text>
<!-- floor -->
<line x1="40" y1="370" x2="720" y2="370" stroke="#374151" stroke-width="3"/>
<line x1="70" y1="60" x2="70" y2="370" stroke="#374151" stroke-width="5"/>
<!-- zone 2 -->
<rect x="420" y="100" width="120" height="270" fill="#fef3c7" stroke="#d97706" stroke-dasharray="6 4"/>
<text x="480" y="210" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">2</text>
<text x="480" y="232" text-anchor="middle" font-size="12" fill="#92400e">IPX4</text>
<!-- zone 1 -->
<rect x="70" y="100" width="350" height="190" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="6 4"/>
<text x="245" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">1</text>
<text x="245" y="202" text-anchor="middle" font-size="12" fill="#1e3a8a">IPX4 (IPX5 при струях)</text>
<!-- bath = zone 0 -->
<path d="M80 290 L410 290 L400 350 Q395 360 380 360 L110 360 Q95 360 90 350 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
<text x="245" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">0 · IPX7</text>
<!-- under bath -->
<text x="245" y="384" text-anchor="middle" font-size="11" fill="#4b5563">под ванной — считай зоной 1</text>
<!-- dims -->
<line x1="600" y1="100" x2="600" y2="370" stroke="#6b7280"/>
<line x1="592" y1="100" x2="608" y2="100" stroke="#6b7280"/>
<text x="612" y="240" font-size="13" fill="#374151">2,25 м</text>
<line x1="420" y1="84" x2="540" y2="84" stroke="#6b7280"/>
<line x1="420" y1="78" x2="420" y2="90" stroke="#6b7280"/><line x1="540" y1="78" x2="540" y2="90" stroke="#6b7280"/>
<text x="480" y="76" text-anchor="middle" font-size="13" fill="#374151">0,6 м</text>
<!-- socket outside -->
<rect x="650" y="250" width="34" height="34" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<circle cx="661" cy="267" r="3" fill="#15803d"/><circle cx="673" cy="267" r="3" fill="#15803d"/>
<text x="667" y="304" text-anchor="middle" font-size="11" fill="#15803d">230 В</text>
<text x="667" y="318" text-anchor="middle" font-size="11" fill="#15803d">+ RCD 30 мА</text>
<text x="245" y="60" text-anchor="middle" font-size="12" fill="#374151">выше 2,25 м над полом — вне зон</text>
</svg>
