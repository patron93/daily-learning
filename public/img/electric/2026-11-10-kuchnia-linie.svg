<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Arial, sans-serif">
<rect width="800" height="460" fill="#fffdf7" rx="16"/>
<text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Кухня: одна линия против трёх</text>
<!-- BEFORE -->
<rect x="16" y="50" width="376" height="394" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="204" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">БЫЛО: всё на одной линии</text>
<rect x="40" y="96" width="90" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="85" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">B16</text>
<text x="85" y="142" text-anchor="middle" font-size="11" fill="#475569">щит</text>
<line x1="130" y1="126" x2="360" y2="126" stroke="#dc2626" stroke-width="7">
  <animate attributeName="stroke" values="#dc2626;#f97316;#dc2626" dur="1.2s" repeatCount="indefinite"/>
</line>
<text x="245" y="114" text-anchor="middle" font-size="12" fill="#991b1b">3×2,5 мм² · 24,6 А</text>
<g font-size="12" text-anchor="middle">
<line x1="170" y1="126" x2="170" y2="200" stroke="#475569" stroke-width="2"/>
<line x1="250" y1="126" x2="250" y2="200" stroke="#475569" stroke-width="2"/>
<line x1="330" y1="126" x2="330" y2="200" stroke="#475569" stroke-width="2"/>
<rect x="125" y="200" width="90" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="170" y="222" font-weight="bold" fill="#111827">чайник</text><text x="170" y="242" fill="#475569">9,6 А</text>
<rect x="205" y="270" width="90" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="250" y="292" font-weight="bold" fill="#111827">микроволн.</text><text x="250" y="312" fill="#475569">6,3 А</text>
<line x1="250" y1="200" x2="250" y2="270" stroke="#475569" stroke-width="2"/>
<rect x="285" y="200" width="90" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="330" y="222" font-weight="bold" fill="#111827">посудом.</text><text x="330" y="242" fill="#475569">8,7 А</text>
</g>
<text x="204" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">24,6 А = 1,54 × In</text>
<text x="204" y="382" text-anchor="middle" font-size="12" fill="#7f1d1d">B16 отключит через минуты — и правильно</text>
<text x="204" y="410" text-anchor="middle" font-size="12" fill="#7f1d1d">«Поставить B25» → провод греется часами</text>
<text x="204" y="428" text-anchor="middle" font-size="12" fill="#7f1d1d">без отключения ✗</text>
<!-- AFTER -->
<rect x="408" y="50" width="376" height="394" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="596" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">СТАЛО: три линии</text>
<g font-size="12">
<rect x="428" y="100" width="70" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="463" y="127" text-anchor="middle" font-weight="bold" fill="#111827">K1 B16</text>
<line x1="498" y1="122" x2="640" y2="122" stroke="#16a34a" stroke-width="5"/>
<rect x="640" y="100" width="128" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="704" y="119" text-anchor="middle" font-weight="bold" fill="#111827">посудомойка</text>
<text x="704" y="136" text-anchor="middle" fill="#166534">8,7 А ✓</text>
<rect x="428" y="180" width="70" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="463" y="207" text-anchor="middle" font-weight="bold" fill="#111827">K2 B16</text>
<line x1="498" y1="202" x2="640" y2="202" stroke="#16a34a" stroke-width="5"/>
<rect x="640" y="180" width="128" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="704" y="199" text-anchor="middle" font-weight="bold" fill="#111827">чайник + кофе</text>
<text x="704" y="216" text-anchor="middle" fill="#166534">15,5 А ✓</text>
<rect x="428" y="260" width="70" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="463" y="287" text-anchor="middle" font-weight="bold" fill="#111827">K3 B16</text>
<line x1="498" y1="282" x2="640" y2="282" stroke="#16a34a" stroke-width="5"/>
<rect x="640" y="260" width="128" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="704" y="279" text-anchor="middle" font-weight="bold" fill="#111827">микроволн. + тостер</text>
<text x="704" y="296" text-anchor="middle" fill="#166534">10,2 А ✓</text>
<text x="569" y="114" text-anchor="middle" fill="#166534">3×2,5</text>
<text x="569" y="194" text-anchor="middle" fill="#166534">3×2,5</text>
<text x="569" y="274" text-anchor="middle" fill="#166534">3×2,5</text>
</g>
<text x="596" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">каждая линия ≤ 16 А</text>
<text x="596" y="374" text-anchor="middle" font-size="12" fill="#14532d">приборы не мешают друг другу</text>
<text x="596" y="398" text-anchor="middle" font-size="12" fill="#14532d">поломка одного — выбивает только его линию</text>
<text x="596" y="422" text-anchor="middle" font-size="12" fill="#14532d">везде УЗО 30 мА, тип A</text>
</svg>
