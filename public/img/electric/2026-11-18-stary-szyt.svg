<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect width="760" height="460" fill="#fbfaf6" rx="12"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Старый щит из блока PRL: 8 находок</text>
  <!-- wooden board -->
  <rect x="40" y="50" width="400" height="390" rx="6" fill="#c8a165" stroke="#7a5a2b" stroke-width="3"/>
  <text x="240" y="430" text-anchor="middle" font-size="12" fill="#4a3415">деревянная основа, открытые клеммы</text>
  <!-- WLZ in -->
  <line x1="120" y1="40" x2="120" y2="80" stroke="#888" stroke-width="5"/>
  <line x1="140" y1="40" x2="140" y2="80" stroke="#888" stroke-width="5"/>
  <text x="160" y="58" font-size="11" fill="#333">WLZ: L + PEN</text>
  <!-- przedlicznikowe fuse -->
  <rect x="100" y="80" width="60" height="40" rx="4" fill="#eee" stroke="#555"/>
  <text x="130" y="105" text-anchor="middle" font-size="11">20 A</text>
  <circle cx="165" cy="85" r="5" fill="#c0392b"/>
  <!-- meter -->
  <rect x="80" y="135" width="140" height="90" rx="6" fill="#f2f2f2" stroke="#444" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-size="13" font-weight="bold">licznik</text>
  <circle cx="150" cy="192" r="18" fill="none" stroke="#444" stroke-width="2"/>
  <line x1="150" y1="192" x2="150" y2="176" stroke="#c0392b" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" from="0 150 192" to="360 150 192" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cx="215" cy="140" r="5" fill="#c0392b"/>
  <!-- fuses -->
  <g>
    <circle cx="300" cy="280" r="28" fill="#f7f3ea" stroke="#555" stroke-width="2"/><text x="300" y="285" text-anchor="middle" font-size="12">10 A</text>
    <circle cx="370" cy="280" r="28" fill="#f7f3ea" stroke="#555" stroke-width="2"/><text x="370" y="285" text-anchor="middle" font-size="12">16 A</text>
    <circle cx="230" cy="280" r="28" fill="#f7f3ea" stroke="#c0392b" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="230" y="280" text-anchor="middle" font-size="12" fill="#c0392b">25 A</text>
    <path d="M214 290 q8 -8 16 0 t16 0" fill="none" stroke="#999" stroke-width="2"/>
  </g>
  <!-- aluminium wires -->
  <g stroke="#b8bec4" stroke-width="5" fill="none">
    <path d="M150 225 L150 245 L230 245 L230 252"/>
    <path d="M150 245 L300 245 L300 252"/><path d="M300 245 L370 245 L370 252"/>
    <path d="M230 308 L230 400"/><path d="M300 308 L300 400"/><path d="M370 308 L370 400"/>
    <path d="M250 310 L250 400"/><path d="M320 310 L320 400"/><path d="M390 310 L390 400"/>
  </g>
  <text x="240" y="395" font-size="11" fill="#333" transform="rotate(-90 240 395)">кухня+ванная</text>
  <!-- callouts -->
  <g font-size="13" fill="#222">
    <g fill="#c0392b" font-weight="bold">
      <circle cx="480" cy="70" r="12"/><circle cx="480" cy="114" r="12"/><circle cx="480" cy="158" r="12"/><circle cx="480" cy="202" r="12"/>
      <circle cx="480" cy="246" r="12"/><circle cx="480" cy="290" r="12"/><circle cx="480" cy="334" r="12"/><circle cx="480" cy="378" r="12"/>
    </g>
    <g fill="#fff" font-weight="bold" text-anchor="middle">
      <text x="480" y="75">1</text><text x="480" y="119">2</text><text x="480" y="163">3</text><text x="480" y="207">4</text>
      <text x="480" y="251">5</text><text x="480" y="295">6</text><text x="480" y="339">7</text><text x="480" y="383">8</text>
    </g>
    <text x="500" y="75">счётчик — OSD, пломба</text>
    <text x="500" y="119">предохранитель до счётчика</text>
    <text x="500" y="163">пробки, одна с «жучком» 25 A</text>
    <text x="500" y="207">алюминий, 2 жилы (TN-C)</text>
    <text x="500" y="251">нет УЗО (в TN-C не работает)</text>
    <text x="500" y="295">нет SPD</text>
    <text x="500" y="339">3 линии на всю квартиру</text>
    <text x="500" y="383">открытые клеммы, дерево</text>
  </g>
  <text x="500" y="420" font-size="12" fill="#666">+ «зануление» перемычкой в розетках</text>
</svg>
