<circle cx="580" cy="86" r="18" fill="#92400e"/><circle cx="611" cy="108" r="18" fill="#111827"/><circle cx="599" cy="145" r="18" fill="#9ca3af"/><circle cx="561" cy="145" r="18" fill="#2563eb"/><circle cx="549" cy="108" r="18" fill="url(#gz)"/>
<g font-size="12" text-anchor="middle" fill="#374151"><text x="580" y="200">L1 коричн. · L2 чёрн. · L3 серый</text><text x="580" y="216">N синий · PE жёлто-зелёный</text></g>
<!-- PEN -->
<text x="390" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">PEN: жёлто-зелёный с синими метками на концах</text>
