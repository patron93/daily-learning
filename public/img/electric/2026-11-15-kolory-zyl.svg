<rect x="160" y="275" width="40" height="22" rx="6" fill="#2563eb"/><rect x="580" y="275" width="40" height="22" rx="6" fill="#2563eb"/>
<text x="390" y="330" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="bold">Жёлто-зелёный — только защита. Никогда не фаза и не провод выключателя.</text>
