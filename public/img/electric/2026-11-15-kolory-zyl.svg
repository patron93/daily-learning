<circle cx="130" cy="115" r="24" fill="#92400e"/><circle cx="200" cy="115" r="24" fill="#2563eb"/><circle cx="270" cy="115" r="24" fill="url(#gz)"/>
<g font-size="14" font-weight="bold" text-anchor="middle"><text x="130" y="175" fill="#92400e">L</text><text x="200" y="175" fill="#2563eb">N</text><text x="270" y="175" fill="#15803d">PE</text></g>
