<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Arial, sans-serif">
<defs><pattern id="gz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#facc15"/><rect x="8" width="8" height="16" fill="#16a34a"/></pattern></defs>
<rect width="780" height="360" fill="#ffffff" rx="16"/>
<text x="390" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Цвета жил по PN-EN 60445</text>
