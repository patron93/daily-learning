<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Почему передают при высоком напряжении: трансформаторы и потери в линии">
<rect width="760" height="340" rx="10" fill="#f8fafc"/>
<text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Зачем нужен переменный ток: трансформатор повышает и понижает напряжение</text>
<rect x="20" y="70" width="120" height="70" rx="8" fill="#e2e8f0" stroke="#475569"/>
<text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">Электростанция</text>
<text x="80" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">10 кВт</text>
<rect x="190" y="75" width="70" height="60" rx="8" fill="#fde68a" stroke="#b45309"/>
<text x="225" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Трансф.</text>
<text x="225" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">вверх ↑</text>
<rect x="500" y="75" width="70" height="60" rx="8" fill="#fde68a" stroke="#b45309"/>
<text x="535" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">Трансф.</text>
<text x="535" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">вниз ↓</text>
<rect x="620" y="70" width="120" height="70" rx="8" fill="#e2e8f0" stroke="#475569"/>
<text x="680" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">Ваш дом</text>
<text x="680" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">230 В</text>
<line x1="140" y1="105" x2="190" y2="105" stroke="#334155" stroke-width="3"/>
<line x1="260" y1="105" x2="500" y2="105" stroke="#b91c1c" stroke-width="4"/>
<line x1="570" y1="105" x2="620" y2="105" stroke="#334155" stroke-width="3"/>
<circle r="5" fill="#b91c1c"><animateMotion dur="2.5s" repeatCount="indefinite" path="M260,105 L500,105"/></circle>
<text x="380" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b91c1c">линия 23 000 В, ток 0,43 А</text>
<rect x="40" y="180" width="320" height="130" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
<text x="200" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7f1d1d">Без трансформатора: 230 В</text>
<text x="200" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">I = 10000 / 230 ≈ 43,5 А</text>
<text x="200" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">потери P = I² × R = 43,5² × 1 Ом</text>
<text x="200" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">≈ 1890 Вт теряется в проводе</text>
<rect x="400" y="180" width="320" height="130" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="560" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">Через 23 кВ</text>
<text x="560" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">I = 10000 / 23000 ≈ 0,43 А</text>
<text x="560" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0f172a">потери P = 0,43² × 1 Ом</text>
<text x="560" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#15803d">≈ 0,19 Вт: в 10 000 раз меньше</text>
</svg>