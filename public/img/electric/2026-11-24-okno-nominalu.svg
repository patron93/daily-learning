<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="780" height="330" rx="14" fill="#fbfbf8"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Окно номинала: розетки 3×2,5 в утеплённой стене (A1)</text>
  <!-- axis: 0..30 A mapped 60..720 (22 px per A) -->
  <line x1="60" y1="170" x2="730" y2="170" stroke="#333" stroke-width="2"/>
  <g font-size="13" fill="#444" text-anchor="middle">
    <line x1="60" y1="165" x2="60" y2="175" stroke="#333"/><text x="60" y="192">0</text>
    <line x1="170" y1="165" x2="170" y2="175" stroke="#333"/><text x="170" y="192">5</text>
    <line x1="280" y1="165" x2="280" y2="175" stroke="#333"/><text x="280" y="192">10</text>
    <line x1="390" y1="165" x2="390" y2="175" stroke="#333"/><text x="390" y="192">15</text>
    <line x1="500" y1="165" x2="500" y2="175" stroke="#333"/><text x="500" y="192">20</text>
    <line x1="610" y1="165" x2="610" y2="175" stroke="#333"/><text x="610" y="192">25</text>
    <line x1="720" y1="165" x2="720" y2="175" stroke="#333"/><text x="720" y="192">30 A</text>
  </g>
  <!-- window from I_B 8.7 (251) to I_z 19.5 (489) -->
  <rect x="251" y="120" width="238" height="40" fill="#c8e8c8" stroke="#4a9a4a"/>
  <text x="370" y="145" text-anchor="middle" font-size="14" fill="#1f5f1f" font-weight="700">окно для I_n</text>
  <rect x="60" y="120" width="191" height="40" fill="#eee"/>
  <text x="155" y="145" text-anchor="middle" font-size="13" fill="#555">мало: выбивает</text>
  <rect x="489" y="120" width="241" height="40" fill="#f6d2d2"/>
  <text x="610" y="145" text-anchor="middle" font-size="13" fill="#8a1f1f">много: кабель греется</text>
  <g font-size="13" fill="#222">
    <line x1="251" y1="100" x2="251" y2="165" stroke="#4a7fc1" stroke-width="2"/>
    <text x="251" y="94" text-anchor="middle" fill="#1f5fa8">I_B ≈ 8,7 A (чайник 2 кВт)</text>
    <line x1="489" y1="100" x2="489" y2="165" stroke="#c14a4a" stroke-width="2"/>
    <text x="489" y="76" text-anchor="middle" fill="#8a1f1f">I_z = 19,5 A</text>
    <text x="489" y="94" text-anchor="middle" fill="#8a1f1f">(2,5 мм², A1)</text>
  </g>
  <!-- candidates -->
  <g font-size="14" font-weight="700">
    <circle cx="280" cy="230" r="16" fill="#c8e8c8" stroke="#4a9a4a"/><text x="280" y="235" text-anchor="middle" fill="#1f5f1f">10</text>
    <circle cx="412" cy="230" r="16" fill="#4a9a4a"/><text x="412" y="235" text-anchor="middle" fill="#fff">16</text>
    <circle cx="500" cy="230" r="16" fill="#f6d2d2" stroke="#c14a4a"/><text x="500" y="235" text-anchor="middle" fill="#8a1f1f">20</text>
    <circle cx="610" cy="230" r="16" fill="#f6d2d2" stroke="#c14a4a"/><text x="610" y="235" text-anchor="middle" fill="#8a1f1f">25</text>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="280" y="266">B10 — можно,</text><text x="280" y="282">но мало запаса</text>
    <text x="412" y="266">B16 ✔</text><text x="412" y="282">стандарт</text>
    <text x="500" y="266">B20 ✘</text><text x="500" y="282">20 &gt; 19,5</text>
    <text x="610" y="266">B25 ✘</text><text x="610" y="282">«чтобы не выбивало»</text>
  </g>
  <text x="390" y="314" text-anchor="middle" font-size="13" fill="#555">Если I_B &gt; I_z — окна нет: никакой автомат не поможет, нужен кабель толще или отдельная линия</text>
</svg>
