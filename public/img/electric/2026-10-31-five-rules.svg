<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Arial, sans-serif">
  <rect width="680" height="380" fill="#fdfcf7" rx="16"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">5 правил: всегда по порядку</text>
  <text x="340" y="54" text-anchor="middle" font-size="13" fill="#6b7280">PN-EN 50110-1 · каждый шаг закрывает свою причину аварий</text>
  <g font-family="Arial, sans-serif">
    <rect x="30" y="70" width="620" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="62" cy="96" r="18" fill="#dc2626"/><text x="62" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">1</text>
    <text x="92" y="92" font-size="16" font-weight="bold" fill="#111827">Отключить · wyłączyć</text>
    <text x="92" y="112" font-size="13" fill="#4b5563">автомат или главный выключатель + PV / генератор / ИБП</text>

    <rect x="30" y="130" width="620" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <circle cx="62" cy="156" r="18" fill="#ea580c"/><text x="62" y="162" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">2</text>
    <text x="92" y="152" font-size="16" font-weight="bold" fill="#111827">Защитить от включения · zabezpieczyć</text>
    <text x="92" y="172" font-size="13" fill="#4b5563">блокиратор + замок, табличка «Nie załączać! Pracują ludzie»</text>

    <rect x="30" y="190" width="620" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="62" cy="216" r="18" fill="#ca8a04"/><text x="62" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">3</text>
    <text x="92" y="212" font-size="16" font-weight="bold" fill="#111827">Проверить отсутствие напряжения · sprawdzić</text>
    <text x="92" y="232" font-size="13" fill="#4b5563">индикатор: живая розетка → L–N, L–PE, N–PE = 0 В → живая розетка</text>
    <text x="640" y="212" text-anchor="end" font-size="12" font-weight="bold" fill="#a16207">ГЛАВНЫЙ</text>
    <text x="640" y="228" text-anchor="end" font-size="12" font-weight="bold" fill="#a16207">ШАГ</text>

    <rect x="30" y="250" width="620" height="52" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="62" cy="276" r="18" fill="#0284c7"/><text x="62" y="282" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">4</text>
    <text x="92" y="272" font-size="16" font-weight="bold" fill="#111827">Заземлить и закоротить · uziemić i zewrzeć</text>
    <text x="92" y="292" font-size="13" fill="#4b5563">ВН и воздушные линии; дома 230 В обычно не делают — но помни об обратном питании</text>

    <rect x="30" y="310" width="620" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="62" cy="336" r="18" fill="#16a34a"/><text x="62" y="342" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">5</text>
    <text x="92" y="332" font-size="16" font-weight="bold" fill="#111827">Оградить соседние части · osłonić</text>
    <text x="92" y="352" font-size="13" fill="#4b5563">вход главного выключателя и всё до счётчика — под напряжением всегда</text>
  </g>
</svg>
