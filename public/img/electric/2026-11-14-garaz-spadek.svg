<text x="380" y="378" text-anchor="middle" font-size="12" fill="#6b7280">1,5 %</text>
<text x="20" y="190" font-size="13" fill="#111827">2,5 мм² · 16 А</text>
<rect x="200" y="176" width="528" height="24" fill="#fca5a5"/><text x="722" y="193" text-anchor="end" font-size="13" font-weight="bold" fill="#7f1d1d">4,4 % ✘</text>
