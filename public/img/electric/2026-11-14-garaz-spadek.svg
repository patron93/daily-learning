<rect x="200" y="260" width="254" height="24" fill="#86efac"/><text x="448" y="277" text-anchor="end" font-size="13" font-weight="bold" fill="#14532d">2,1 % ✔</text>
<text x="20" y="316" font-size="13" fill="#111827">6 мм² · 24,6 А</text>
