<text x="695" y="118" text-anchor="middle" font-size="12" fill="#1e3a8a">подщит</text>
<line x1="200" y1="160" x2="200" y2="360" stroke="#9ca3af"/>
<text x="195" y="364" text-anchor="end" font-size="12" fill="#6b7280">0 %</text>
<line x1="200" y1="360" x2="740" y2="360" stroke="#9ca3af"/>
<line x1="560" y1="160" x2="560" y2="360" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
