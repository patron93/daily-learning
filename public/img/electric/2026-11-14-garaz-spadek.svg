<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Arial, sans-serif">
<rect width="780" height="400" fill="#ffffff" rx="16"/>
<text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Кабель до гаража 40 м: падение напряжения</text>
<text x="390" y="54" text-anchor="middle" font-size="13" fill="#4b5563">однофазная линия, медь, ΔU = I × 0,0175 × 80 / S, плюс 0,5 % до щита дома</text>
<rect x="30" y="72" width="110" height="60" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
<text x="85" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Щит дома</text>
<text x="85" y="118" text-anchor="middle" font-size="12" fill="#374151">B16 / B25</text>
<line x1="140" y1="102" x2="640" y2="102" stroke="#b45309" stroke-width="6" stroke-dasharray="14 6">
<animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/>
</line>
<text x="390" y="92" text-anchor="middle" font-size="13" fill="#92400e">YKY в земле, L = 40 м (туда и обратно 80 м)</text>
<rect x="640" y="72" width="110" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
