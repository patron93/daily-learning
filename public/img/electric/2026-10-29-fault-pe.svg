<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Пробой на корпус: с проводом PE и без него">
<rect width="760" height="360" rx="10" fill="#f8fafc"/>
<text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Пробой фазы на корпус: что происходит с PE и без него</text>
<text x="190" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">Без PE: корпус «висит» под 230 В</text>
<rect x="110" y="120" width="160" height="90" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<text x="190" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">стиральная машина</text>
<line x1="20" y1="90" x2="110" y2="150" stroke="#b91c1c" stroke-width="3"/>
<text x="20" y="82" font-family="sans-serif" font-size="12" fill="#b91c1c">L (фаза) касается корпуса</text>
<circle cx="190" cy="265" r="14" fill="#fde68a" stroke="#b45309"/>
<text x="190" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b45309">человек: путь тока через тело в пол</text>
<line x1="190" y1="210" x2="190" y2="250" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/></line>
<text x="190" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">автомат молчит: тока мало, он не «видит» аварии</text>
<line x1="380" y1="50" x2="380" y2="340" stroke="#cbd5e1" stroke-width="2"/>
<text x="570" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">С PE: ток уходит по проводу, автомат выбивает</text>
<rect x="490" y="120" width="160" height="90" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<text x="570" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">стиральная машина</text>
<line x1="400" y1="90" x2="490" y2="150" stroke="#b91c1c" stroke-width="3"/>
<text x="400" y="82" font-family="sans-serif" font-size="12" fill="#b91c1c">L касается корпуса</text>
<path d="M650 190 L710 190 L710 300 L400 300" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/></path>
<text x="560" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">PE (жёлто-зелёный): путь без сопротивления тела</text>
<text x="570" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">ток большой, автомат/УЗО отключают за доли секунды</text>
</svg>
