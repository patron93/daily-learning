<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="system-ui,sans-serif">
  <rect width="700" height="330" rx="14" fill="#f6f8fa"/>
  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#24292f">Выключатель выключен: на фазе или на нуле?</text>
  <line x1="350" y1="45" x2="350" y2="300" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- ЛЕВО: правильно -->
  <text x="175" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7f37">✔ Выключатель на фазе</text>
  <text x="30" y="108" font-size="14" fill="#cf222e" font-weight="700">L фаза</text>
  <text x="30" y="238" font-size="14" fill="#0969da" font-weight="700">N ноль</text>
  <line x1="90" y1="104" x2="130" y2="104" stroke="#cf222e" stroke-width="6"/>
  <circle cx="135" cy="104" r="5" fill="#24292f"/>
  <line x1="135" y1="104" x2="172" y2="82" stroke="#24292f" stroke-width="5"/>
  <circle cx="185" cy="104" r="5" fill="#24292f"/>
  <line x1="190" y1="104" x2="260" y2="104" stroke="#8c959f" stroke-width="6"/>
  <path d="M260 104 H290 V150" fill="none" stroke="#8c959f" stroke-width="6"/>
  <circle cx="290" cy="180" r="30" fill="#f6f8fa" stroke="#57606a" stroke-width="3"/>
  <path d="M276 192 L283 170 L290 192 L297 170 L304 192" fill="none" stroke="#57606a" stroke-width="3"/>
  <path d="M290 210 V234 H90" fill="none" stroke="#0969da" stroke-width="6"/>
  <text x="175" y="136" text-anchor="middle" font-size="12" fill="#57606a">разрыв</text>
  <text x="175" y="272" text-anchor="middle" font-size="13" fill="#24292f">Патрон лампы без напряжения.</text>
  <text x="175" y="290" text-anchor="middle" font-size="13" fill="#24292f">Менять лампу безопаснее.</text>
  <!-- ПРАВО: неправильно -->
  <text x="525" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#cf222e">✘ Выключатель на нуле</text>
  <text x="380" y="108" font-size="14" fill="#cf222e" font-weight="700">L фаза</text>
  <text x="380" y="238" font-size="14" fill="#0969da" font-weight="700">N ноль</text>
  <line x1="440" y1="104" x2="610" y2="104" stroke="#cf222e" stroke-width="6"/>
  <path d="M610 104 V150" fill="none" stroke="#cf222e" stroke-width="6"/>
  <circle cx="610" cy="180" r="30" fill="#ffebe9" stroke="#cf222e" stroke-width="3">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <path d="M596 192 L603 170 L610 192 L617 170 L624 192" fill="none" stroke="#cf222e" stroke-width="3"/>
  <text x="610" y="130" text-anchor="end" font-size="13" fill="#cf222e" font-weight="700" dx="-18">230 В!</text>
  <path d="M610 210 V234 H560" fill="none" stroke="#0969da" stroke-width="6"/>
  <circle cx="555" cy="234" r="5" fill="#24292f"/>
  <line x1="555" y1="234" x2="520" y2="212" stroke="#24292f" stroke-width="5"/>
  <circle cx="505" cy="234" r="5" fill="#24292f"/>
  <line x1="500" y1="234" x2="440" y2="234" stroke="#0969da" stroke-width="6"/>
  <text x="525" y="272" text-anchor="middle" font-size="13" fill="#24292f">Лампа не горит, но фаза</text>
  <text x="525" y="290" text-anchor="middle" font-size="13" fill="#24292f">дошла до патрона. Опасно!</text>
</svg>
