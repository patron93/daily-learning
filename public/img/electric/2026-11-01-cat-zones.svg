<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, sans-serif">
  <rect width="720" height="300" fill="#fdfcf7" rx="16"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Категории измерений: чем ближе к вводу, тем сильнее скачок</text>
  <rect x="20" y="55" width="215" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="127" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">CAT IV</text>
  <text x="127" y="106" text-anchor="middle" font-size="13" fill="#7f1d1d">złącze · licznik</text>
  <text x="127" y="124" text-anchor="middle" font-size="13" fill="#7f1d1d">кабель до щита</text>
  <text x="127" y="160" text-anchor="middle" font-size="12" fill="#7f1d1d">зона OSD и</text>
  <text x="127" y="176" text-anchor="middle" font-size="12" fill="#7f1d1d">электрика SEP</text>
  <rect x="252" y="55" width="215" height="150" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#9a3412">CAT III</text>
  <text x="360" y="106" text-anchor="middle" font-size="13" fill="#7c2d12">щит · rozdzielnica</text>
  <text x="360" y="124" text-anchor="middle" font-size="13" fill="#7c2d12">проводка, клеммы розеток</text>
  <text x="360" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">здесь работаешь ты →</text>
  <text x="360" y="176" text-anchor="middle" font-size="12" fill="#7c2d12">прибор ≥ CAT III</text>
  <rect x="485" y="55" width="215" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="592" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">CAT II</text>
  <text x="592" y="106" text-anchor="middle" font-size="13" fill="#14532d">всё на вилке</text>
  <text x="592" y="124" text-anchor="middle" font-size="13" fill="#14532d">чайник, удлинитель</text>
  <text x="592" y="160" text-anchor="middle" font-size="12" fill="#14532d">скачок уже</text>
  <text x="592" y="176" text-anchor="middle" font-size="12" fill="#14532d">ослаблен проводкой</text>
  <path d="M30 245 L690 245" stroke="#9ca3af" stroke-width="2"/>
  <path d="M40 245 l15 -30 l10 20 l12 -28 l10 38" fill="none" stroke="#dc2626" stroke-width="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;600 0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="360" y="280" text-anchor="middle" font-size="13" fill="#4b5563">импульс перенапряжения (przepięcie) затухает по пути: CAT III 600 V ≈ 6 кВ · CAT IV 600 V ≈ 8 кВ</text>
</svg>
