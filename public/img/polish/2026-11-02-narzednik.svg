<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, sans-serif">
  <rect width="640" height="360" fill="#fdfcf7" rx="16"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Jestem… kim? → narzędnik</text>
  <text x="320" y="58" text-anchor="middle" font-size="14" fill="#6b7280">być + rzeczownik = творительный падеж</text>
  <g font-size="16" fill="#111827">
    <rect x="30" y="78" width="580" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="50" y="104" font-weight="bold" fill="#1d4ed8">m + согласный → -em</text>
    <text x="50" y="128">inżynier → inżynier<tspan fill="#2563eb" font-weight="bold">em</tspan>, lekarz → lekarz<tspan fill="#2563eb" font-weight="bold">em</tspan>, Polak → Polak<tspan fill="#2563eb" font-weight="bold">iem</tspan></text>
    <rect x="30" y="148" width="580" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="50" y="174" font-weight="bold" fill="#15803d">m / ż на -a → -ą</text>
    <text x="50" y="198">programist<tspan fill="#16a34a" font-weight="bold">ą</tspan>, kierowc<tspan fill="#16a34a" font-weight="bold">ą</tspan>, pielęgniark<tspan fill="#16a34a" font-weight="bold">ą</tspan></text>
    <rect x="30" y="218" width="580" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="50" y="244" font-weight="bold" fill="#b91c1c">Остаётся mianownik:</text>
    <text x="50" y="270">To jest programista.  (подлежащее «to»)</text>
    <text x="50" y="294">Jestem zmęczony.  (только прилагательное)</text>
    <text x="50" y="318">Jestem Siarhei.  (имя)</text>
  </g>
</svg>
