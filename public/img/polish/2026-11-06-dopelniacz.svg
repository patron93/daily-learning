<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
<rect width="760" height="420" fill="#fffdf7" rx="16"/>
<text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">Dopełniacz: кого? чего?</text>
<text x="380" y="58" text-anchor="middle" font-size="13" fill="#4b5563">три «двери» в родительный падеж</text>
<rect x="20" y="80" width="230" height="230" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="135" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">1. Сколько чего?</text>
<text x="40" y="140" font-size="14" fill="#111827">butelka wod<tspan fill="#dc2626" font-weight="bold">y</tspan></text>
<text x="40" y="166" font-size="14" fill="#111827">szklanka mlek<tspan fill="#dc2626" font-weight="bold">a</tspan></text>
<text x="40" y="192" font-size="14" fill="#111827">kawałek chleb<tspan fill="#dc2626" font-weight="bold">a</tspan></text>
<text x="40" y="218" font-size="14" fill="#111827">trochę cukr<tspan fill="#dc2626" font-weight="bold">u</tspan></text>
<text x="40" y="244" font-size="14" fill="#111827">dużo prac<tspan fill="#dc2626" font-weight="bold">y</tspan></text>
<text x="40" y="270" font-size="14" fill="#111827">mało czas<tspan fill="#dc2626" font-weight="bold">u</tspan></text>
<rect x="265" y="80" width="230" height="230" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="380" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">2. Предлоги</text>
<text x="285" y="140" font-size="14" fill="#111827"><tspan font-weight="bold">bez</tspan> cukr<tspan fill="#dc2626" font-weight="bold">u</tspan> — без сахара</text>
<text x="285" y="166" font-size="14" fill="#111827"><tspan font-weight="bold">dla</tspan> mam<tspan fill="#dc2626" font-weight="bold">y</tspan> — для мамы</text>
<text x="285" y="192" font-size="14" fill="#111827"><tspan font-weight="bold">do</tspan> sklep<tspan fill="#dc2626" font-weight="bold">u</tspan> — в магазин</text>
<text x="285" y="218" font-size="14" fill="#111827"><tspan font-weight="bold">od</tspan> ran<tspan fill="#dc2626" font-weight="bold">a</tspan> — с утра</text>
<text x="285" y="244" font-size="14" fill="#111827"><tspan font-weight="bold">z</tspan> prac<tspan fill="#dc2626" font-weight="bold">y</tspan> — с работы</text>
<text x="285" y="270" font-size="14" fill="#111827"><tspan font-weight="bold">u</tspan> lekarz<tspan fill="#dc2626" font-weight="bold">a</tspan> — у врача</text>
<rect x="510" y="80" width="230" height="230" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
<text x="625" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">3. Отрицание</text>
<text x="530" y="140" font-size="14" fill="#111827">Nie ma chleb<tspan fill="#dc2626" font-weight="bold">a</tspan>.</text>
<text x="530" y="166" font-size="14" fill="#111827">Szef<tspan fill="#dc2626" font-weight="bold">a</tspan> nie ma.</text>
<text x="530" y="192" font-size="14" fill="#111827">Nie piję kaw<tspan fill="#dc2626" font-weight="bold">y</tspan>.</text>
<text x="530" y="230" font-size="12" fill="#4b5563">но: To nie jest kawa.</text>
<text x="530" y="248" font-size="12" fill="#4b5563">(с być падеж не меняется)</text>
<rect x="20" y="326" width="720" height="78" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="40" y="354" font-size="15" font-weight="bold" fill="#854d0e">Ловушка: «иду в магазин» → idę DO sklepu (не «w sklep»)</text>
<text x="40" y="382" font-size="14" fill="#111827">do pracy · do domu · do Warszawy · do lekarza — всё с родительным</text>
</svg>
