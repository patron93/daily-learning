<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Arial, sans-serif">
<rect width="720" height="470" fill="#fffdf7" rx="16"/>
<text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Miesiące: польский и белорусский</text>
<text x="360" y="58" text-anchor="middle" font-size="14" fill="#4b5563">зелёные — один корень и тот же месяц</text>
<rect x="20" y="74" width="165" height="118" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="102.5" y="96" text-anchor="middle" font-size="12" fill="#6b7280">1</text>
<text x="102.5" y="122" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">styczeń</text>
<text x="102.5" y="148" text-anchor="middle" font-size="15" fill="#1f2937">студзень</text>
<text x="102.5" y="174" text-anchor="middle" font-size="11.5" fill="#4b5563">стык лет</text>
<rect x="195" y="74" width="165" height="118" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="277.5" y="96" text-anchor="middle" font-size="12" fill="#6b7280">2</text>
<text x="277.5" y="122" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">luty</text>
<text x="277.5" y="148" text-anchor="middle" font-size="15" fill="#1f2937">люты</text>
<text x="277.5" y="174" text-anchor="middle" font-size="11.5" fill="#4b5563">лютый мороз</text>
<rect x="370" y="74" width="165" height="118" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="452.5" y="96" text-anchor="middle" font-size="12" fill="#6b7280">3</text>
<text x="452.5" y="122" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">marzec</text>
<text x="452.5" y="148" text-anchor="middle" font-size="15" fill="#1f2937">сакавік</text>
<text x="452.5" y="174" text-anchor="middle" font-size="11.5" fill="#4b5563">Марс (латынь)</text>
<rect x="545" y="74" width="165" height="118" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="627.5" y="96" text-anchor="middle" font-size="12" fill="#6b7280">4</text>
<text x="627.5" y="122" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">kwiecień</text>
<text x="627.5" y="148" text-anchor="middle" font-size="15" fill="#1f2937">красавік</text>
<text x="627.5" y="174" text-anchor="middle" font-size="11.5" fill="#4b5563">kwiat — цветок</text>
<rect x="20" y="204" width="165" height="118" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="102.5" y="226" text-anchor="middle" font-size="12" fill="#6b7280">5</text>
<text x="102.5" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">maj</text>
<text x="102.5" y="278" text-anchor="middle" font-size="15" fill="#1f2937">травень</text>
<text x="102.5" y="304" text-anchor="middle" font-size="11.5" fill="#4b5563">Майя (латынь)</text>
<rect x="195" y="204" width="165" height="118" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="277.5" y="226" text-anchor="middle" font-size="12" fill="#6b7280">6</text>
<text x="277.5" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">czerwiec</text>
<text x="277.5" y="278" text-anchor="middle" font-size="15" fill="#1f2937">чэрвень</text>
<text x="277.5" y="304" text-anchor="middle" font-size="11.5" fill="#4b5563">червец, красная краска</text>
<rect x="370" y="204" width="165" height="118" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="452.5" y="226" text-anchor="middle" font-size="12" fill="#6b7280">7</text>
<text x="452.5" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">lipiec</text>
<text x="452.5" y="278" text-anchor="middle" font-size="15" fill="#1f2937">ліпень</text>
<text x="452.5" y="304" text-anchor="middle" font-size="11.5" fill="#4b5563">lipa — липа</text>
<rect x="545" y="204" width="165" height="118" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="627.5" y="226" text-anchor="middle" font-size="12" fill="#6b7280">8</text>
<text x="627.5" y="252" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">sierpień</text>
<text x="627.5" y="278" text-anchor="middle" font-size="15" fill="#1f2937">жнівень</text>
<text x="627.5" y="304" text-anchor="middle" font-size="11.5" fill="#4b5563">sierp — серп</text>
<rect x="20" y="334" width="165" height="118" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="102.5" y="356" text-anchor="middle" font-size="12" fill="#6b7280">9</text>
<text x="102.5" y="382" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">wrzesień</text>
<text x="102.5" y="408" text-anchor="middle" font-size="15" fill="#1f2937">верасень</text>
<text x="102.5" y="434" text-anchor="middle" font-size="11.5" fill="#4b5563">wrzos — вереск</text>
<rect x="195" y="334" width="165" height="118" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="277.5" y="356" text-anchor="middle" font-size="12" fill="#6b7280">10</text>
<text x="277.5" y="382" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">październik</text>
<text x="277.5" y="408" text-anchor="middle" font-size="15" fill="#1f2937">кастрычнік</text>
<text x="277.5" y="434" text-anchor="middle" font-size="11.5" fill="#4b5563">paździerze — костра льна</text>
<rect x="370" y="334" width="165" height="118" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
<text x="452.5" y="356" text-anchor="middle" font-size="12" fill="#6b7280">11</text>
<text x="452.5" y="382" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">listopad</text>
<text x="452.5" y="408" text-anchor="middle" font-size="15" fill="#1f2937">лістапад</text>
<text x="452.5" y="434" text-anchor="middle" font-size="11.5" fill="#4b5563">листья падают</text>
<rect x="545" y="334" width="165" height="118" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="627.5" y="356" text-anchor="middle" font-size="12" fill="#6b7280">12</text>
<text x="627.5" y="382" text-anchor="middle" font-size="19" font-weight="bold" fill="#b91c1c">grudzień</text>
<text x="627.5" y="408" text-anchor="middle" font-size="15" fill="#1f2937">снежань</text>
<text x="627.5" y="434" text-anchor="middle" font-size="11.5" fill="#4b5563">gruda — мёрзлый ком</text>
</svg>