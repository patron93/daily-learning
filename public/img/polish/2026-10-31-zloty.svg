<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, sans-serif">
  <rect width="640" height="340" fill="#fdfcf7" rx="16"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Ile kosztuje? Число + złoty</text>
  <text x="320" y="58" text-anchor="middle" font-size="14" fill="#6b7280">как «1 рубль / 2 рубля / 5 рублей», только формы другие</text>
  <rect x="25" y="80" width="185" height="200" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="117" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#15803d">1</text>
  <text x="117" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">złoty</text>
  <text x="117" y="180" text-anchor="middle" font-size="15" fill="#111827">jeden złoty</text>
  <text x="117" y="205" text-anchor="middle" font-size="15" fill="#111827">jeden grosz</text>
  <rect x="227" y="80" width="185" height="200" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="319" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">2, 3, 4</text>
  <text x="319" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">złote</text>
  <text x="319" y="180" text-anchor="middle" font-size="15" fill="#111827">trzy złote</text>
  <text x="319" y="205" text-anchor="middle" font-size="15" fill="#111827">dwa grosze</text>
  <text x="319" y="235" text-anchor="middle" font-size="13" fill="#6b7280">и 22–24, 32–34, 42–44…</text>
  <rect x="429" y="80" width="185" height="200" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="521" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#b91c1c">5+, 12–14</text>
  <text x="521" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">złotych</text>
  <text x="521" y="180" text-anchor="middle" font-size="15" fill="#111827">pięć złotych</text>
  <text x="521" y="205" text-anchor="middle" font-size="15" fill="#111827">dwanaście groszy</text>
  <text x="521" y="235" text-anchor="middle" font-size="13" fill="#6b7280">и 21: dwadzieścia jeden</text>
  <text x="521" y="252" text-anchor="middle" font-size="13" fill="#6b7280">złotych</text>
  <rect x="170" y="294" width="300" height="34" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="317" text-anchor="middle" font-size="15" fill="#111827">12,99 zł → «dwanaście dziewięćdziesiąt dziewięć»</text>
</svg>
