<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, sans-serif">
  <rect width="640" height="360" fill="#fdfcf7" rx="16"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Biernik: kogo? co?</text>
  <text x="320" y="58" text-anchor="middle" font-size="14" fill="#6b7280">Kupuję… / Przymierzam… / Widzę…</text>
  <rect x="30" y="80" width="280" height="250" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">Меняется</text>
  <g font-size="16" fill="#111827">
    <text x="50" y="145">ż -a → -ę</text>
    <text x="70" y="172">kurtk<tspan fill="#2563eb" font-weight="bold">ę</tspan>, czapk<tspan fill="#2563eb" font-weight="bold">ę</tspan>, kaw<tspan fill="#2563eb" font-weight="bold">ę</tspan></text>
    <text x="70" y="197">koleg<tspan fill="#2563eb" font-weight="bold">ę</tspan> (m на -a)</text>
    <text x="50" y="240">m одушевл. + -a</text>
    <text x="70" y="267">brat<tspan fill="#2563eb" font-weight="bold">a</tspan>, szef<tspan fill="#2563eb" font-weight="bold">a</tspan>, ps<tspan fill="#2563eb" font-weight="bold">a</tspan></text>
    <text x="70" y="300" font-size="14" fill="#6b7280">прил. ż: now<tspan fill="#2563eb" font-weight="bold">ą</tspan> kurtkę</text>
  </g>
  <rect x="330" y="80" width="280" height="250" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="470" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#374151">Не меняется</text>
  <g font-size="16" fill="#111827">
    <text x="350" y="145">m неодушевлённый</text>
    <text x="370" y="172">sweter, rozmiar</text>
    <text x="350" y="215">n (средний род)</text>
    <text x="370" y="242">mleko, piwo</text>
    <text x="350" y="285">ż на согласный</text>
    <text x="370" y="312">noc, sól</text>
  </g>
</svg>
