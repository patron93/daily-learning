<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect width="640" height="400" fill="#fdfcf7" rx="16"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Boli mnie + część ciała (mianownik)</text>
  <text x="320" y="58" text-anchor="middle" font-size="14" fill="#6b7280">дословно: «болит меня …» — как в русском «у меня болит …»</text>
  <!-- figure -->
  <g stroke="#374151" stroke-width="3" fill="#e0f2fe">
    <circle cx="320" cy="115" r="32"/>
    <rect x="300" y="147" width="40" height="18" fill="#fde68a"/>
    <rect x="278" y="165" width="84" height="120" rx="20"/>
    <line x1="278" y1="180" x2="240" y2="260" />
    <line x1="362" y1="180" x2="400" y2="260" />
    <line x1="300" y1="285" x2="292" y2="312" />
    <line x1="340" y1="285" x2="348" y2="312" />
  </g>
  <circle cx="335" cy="125" r="5" fill="#ef4444"/>
  <!-- labels -->
  <g font-size="16" fill="#111827">
    <line x1="290" y1="100" x2="150" y2="90" stroke="#ef4444" stroke-width="2"/>
    <text x="30" y="86" font-weight="bold">głowa</text><text x="30" y="106" fill="#6b7280" font-size="13">голова</text>
    <line x1="335" y1="125" x2="480" y2="100" stroke="#ef4444" stroke-width="2"/>
    <text x="488" y="96" font-weight="bold">ząb</text><text x="488" y="116" fill="#6b7280" font-size="13">зуб</text>
    <line x1="320" y1="156" x2="150" y2="170" stroke="#ef4444" stroke-width="2"/>
    <text x="30" y="166" font-weight="bold">gardło</text><text x="30" y="186" fill="#6b7280" font-size="13">горло</text>
    <line x1="320" y1="245" x2="480" y2="230" stroke="#ef4444" stroke-width="2"/>
    <text x="488" y="226" font-weight="bold">brzuch</text><text x="488" y="246" fill="#6b7280" font-size="13">живот</text>
    <line x1="290" y1="200" x2="150" y2="250" stroke="#ef4444" stroke-width="2"/>
    <text x="30" y="246" font-weight="bold">plecy (мн.)</text><text x="30" y="266" fill="#6b7280" font-size="13">спина → Bolą mnie plecy</text>
  </g>
  <rect x="150" y="320" width="340" height="56" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="320" y="344" text-anchor="middle" font-size="15" fill="#14532d">Lekarz: Co Panu dolega?</text>
  <text x="320" y="366" text-anchor="middle" font-size="15" fill="#14532d" font-weight="bold">Ja: Boli mnie gardło i mam gorączkę.</text>
</svg>
