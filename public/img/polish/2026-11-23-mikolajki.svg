<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="420" rx="14" fill="#fbfaf6"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Kto przynosi prezenty? — Кто приносит подарки?</text>
  <rect x="30" y="58" width="700" height="70" rx="10" fill="#ffe3e3" stroke="#c62828"/>
  <text x="60" y="88" font-size="20" font-weight="700" fill="#8e1b1b">6 grudnia · Mikołajki</text>
  <text x="60" y="114" font-size="15" fill="#8e1b1b">Mikołaj → pod poduszką / w bucie: cukierki, mała zabawka… albo rózga 😉</text>
  <text x="380" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#333">24 grudnia · Wigilia · prezenty pod choinkę (Gwiazdka)</text>
  <g font-size="15">
    <rect x="30" y="176" width="165" height="150" rx="10" fill="#fff3d6" stroke="#e0a400"/>
    <text x="112" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#7a5600">Mikołaj</text>
    <text x="112" y="232" text-anchor="middle" fill="#7a5600">святой Николай</text>
    <text x="112" y="270" text-anchor="middle" fill="#555">почти вся</text>
    <text x="112" y="290" text-anchor="middle" fill="#555">Польша</text>
    <rect x="208" y="176" width="165" height="150" rx="10" fill="#dbe9ff" stroke="#1d4ea0"/>
    <text x="290" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ea0">Gwiazdor</text>
    <text x="290" y="232" text-anchor="middle" fill="#1d4ea0">gwiazda = звезда</text>
    <text x="290" y="270" text-anchor="middle" fill="#555">Wielkopolska,</text>
    <text x="290" y="290" text-anchor="middle" fill="#555">Kujawy, Pomorze</text>
    <rect x="386" y="176" width="165" height="150" rx="10" fill="#e3f4e1" stroke="#2e7d32"/>
    <text x="468" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#2e7d32">Dzieciątko</text>
    <text x="468" y="232" text-anchor="middle" fill="#2e7d32">младенец Иисус</text>
    <text x="468" y="270" text-anchor="middle" fill="#555">Górny Śląsk,</text>
    <text x="468" y="290" text-anchor="middle" fill="#555">część Małopolski</text>
    <rect x="564" y="176" width="166" height="150" rx="10" fill="#efe3fb" stroke="#6a1b9a"/>
    <text x="647" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#6a1b9a">Aniołek</text>
    <text x="647" y="232" text-anchor="middle" fill="#6a1b9a">ангелочек</text>
    <text x="647" y="270" text-anchor="middle" fill="#555">юго-восток</text>
    <text x="647" y="290" text-anchor="middle" fill="#555">(dawna Galicja)</text>
  </g>
  <rect x="30" y="344" width="700" height="56" rx="10" fill="#f1f1f1" stroke="#999"/>
  <text x="380" y="368" text-anchor="middle" font-size="15" fill="#333">⚠️ komin = дымоход, труба   ·   kominek = камин   ·   cukier = сахар, cukierek = конфета</text>
  <text x="380" y="390" text-anchor="middle" font-size="14" fill="#666">Dziadek Mróz в Польше не приходит — главный день подарков 24 grudnia</text>
</svg>
