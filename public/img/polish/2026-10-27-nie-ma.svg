<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, sans-serif">
  <rect width="640" height="340" fill="#fdfcf7" rx="16"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">mam … → nie mam …</text>
  <text x="320" y="58" text-anchor="middle" font-size="14" fill="#6b7280">после nie: biernik (что?) → dopełniacz (чего?)</text>
  <rect x="30" y="80" width="250" height="200" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#15803d">Mam… (biernik)</text>
  <g font-size="17" fill="#111827">
    <text x="60" y="145">kaw<tspan fill="#16a34a" font-weight="bold">ę</tspan></text>
    <text x="60" y="178">masł<tspan fill="#16a34a" font-weight="bold">o</tspan></text>
    <text x="60" y="211">ser</text>
    <text x="60" y="244">czas</text>
  </g>
  <g>
    <path d="M295 180 H345" stroke="#6b7280" stroke-width="3" marker-end="url(#a)"/>
    <text x="320" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">nie</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
  <rect x="360" y="80" width="250" height="200" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="485" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">Nie mam… (dopełniacz)</text>
  <g font-size="17" fill="#111827">
    <text x="390" y="145">kaw<tspan fill="#dc2626" font-weight="bold">y</tspan></text>
    <text x="390" y="178">masł<tspan fill="#dc2626" font-weight="bold">a</tspan></text>
    <text x="390" y="211">ser<tspan fill="#dc2626" font-weight="bold">a</tspan></text>
    <text x="390" y="244">czas<tspan fill="#dc2626" font-weight="bold">u</tspan></text>
  </g>
  <text x="320" y="315" text-anchor="middle" font-size="14" fill="#374151">Исключение: być — To jest kawa → To nie jest kawa</text>
</svg>
