<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, sans-serif">
  <rect width="720" height="300" fill="#fbfaf6" rx="12"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Aspekt: процесс или результат</text>
  <!-- imperfective -->
  <text x="40" y="78" font-size="17" font-weight="bold" fill="#1f5fa8">niedokonany — несовершенный</text>
  <text x="40" y="100" font-size="14" fill="#444">pisałem · naprawiałem · kupuję (процесс, привычка)</text>
  <line x1="40" y1="140" x2="680" y2="140" stroke="#bbb" stroke-width="2"/>
  <path d="M60 140 q20 -24 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#1f5fa8" stroke-width="4">
    <animate attributeName="stroke-dasharray" values="0,700;700,0" dur="3s" repeatCount="indefinite"/>
  </path>
  <text x="440" y="146" font-size="14" fill="#1f5fa8">… а закончил ли — неизвестно</text>
  <!-- perfective -->
  <text x="40" y="196" font-size="17" font-weight="bold" fill="#2e7d32">dokonany — совершенный</text>
  <text x="40" y="218" font-size="14" fill="#444">napisałem · naprawiłem · kupię (один результат)</text>
  <line x1="40" y1="258" x2="680" y2="258" stroke="#bbb" stroke-width="2"/>
  <circle cx="300" cy="258" r="13" fill="#2e7d32">
    <animate attributeName="r" values="9;15;9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M293 258 l5 6 l10 -12" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="330" y="264" font-size="14" fill="#2e7d32">готово! — Zrobione!</text>
  <text x="560" y="290" font-size="12" fill="#888">время →</text>
</svg>
