<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, sans-serif">
<rect width="760" height="360" fill="#fffdf7" rx="16"/>
<text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">Lanie wosku — литьё воска на andrzejki</text>
<text x="380" y="58" text-anchor="middle" font-size="13" fill="#4b5563">29 listopada wieczorem · вечером 29 ноября</text>
<!-- step 1: candle -->
<rect x="40" y="80" width="210" height="250" rx="12" fill="#fef3c7"/>
<text x="145" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">1. wosk + świeca</text>
<rect x="128" y="170" width="34" height="110" rx="4" fill="#fde68a" stroke="#b45309"/>
<line x1="145" y1="170" x2="145" y2="158" stroke="#374151" stroke-width="2"/>
<path d="M145 128 C135 145 138 158 145 160 C152 158 155 145 145 128 Z" fill="#f97316">
<animate attributeName="opacity" values="1;0.6;1" dur="1.2s" repeatCount="indefinite"/></path>
<text x="145" y="306" text-anchor="middle" font-size="13" fill="#374151">świeca — свеча, wosk — воск</text>
<!-- step 2: key and water -->
<rect x="275" y="80" width="210" height="250" rx="12" fill="#dbeafe"/>
<text x="380" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">2. przez ucho klucza</text>
<circle cx="380" cy="150" r="16" fill="none" stroke="#6b7280" stroke-width="6"/>
<rect x="374" y="166" width="12" height="40" fill="#6b7280"/>
<rect x="386" y="190" width="10" height="6" fill="#6b7280"/><rect x="386" y="200" width="8" height="6" fill="#6b7280"/>
<circle cx="380" cy="150" r="4" fill="#f59e0b">
<animate attributeName="cy" values="140;250" dur="1.6s" repeatCount="indefinite"/></circle>
<path d="M320 250 Q380 300 440 250 Z" fill="#93c5fd" stroke="#1d4ed8"/>
<text x="380" y="306" text-anchor="middle" font-size="13" fill="#374151">woda — холодная вода</text>
<!-- step 3: shadow -->
<rect x="510" y="80" width="210" height="250" rx="12" fill="#ede9fe"/>
<text x="615" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">3. cień na ścianie</text>
<path d="M600 160 C585 140 560 160 600 200 C640 160 615 140 600 160 Z" fill="#fbbf24" stroke="#b45309"/>
<path d="M640 150 C625 125 590 150 640 210 C690 150 655 125 640 150 Z" fill="#4c1d95" opacity="0.35" transform="translate(0,40)"/>
<text x="615" y="285" text-anchor="middle" font-size="13" fill="#374151">serce? → miłość</text>
<text x="615" y="306" text-anchor="middle" font-size="13" fill="#374151">wróżba o przyszłości</text>
</svg>
