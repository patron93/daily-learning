<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui, sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Angular и TypeScript 7: что меняет 7.1</text>

  <!-- left column: now -->
  <text x="170" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Сейчас (TS 7.0, без API)</text>
  <rect x="40" y="78" width="260" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="170" y="102" text-anchor="middle" font-size="13" fill="#374151">@angular/compiler-cli</text>
  <text x="170" y="121" text-anchor="middle" font-size="12" fill="#374151">вызывает JS-API компилятора</text>
  <line x1="170" y1="134" x2="170" y2="164" stroke="#6b7280" stroke-width="2"/>
  <polygon points="164,160 176,160 170,170" fill="#6b7280"/>
  <rect x="40" y="172" width="260" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="170" y="196" text-anchor="middle" font-size="13" fill="#374151">TypeScript 6.0 (JS)</text>
  <text x="170" y="215" text-anchor="middle" font-size="12" fill="#374151">парсинг, трансформы, type-check</text>
  <rect x="40" y="250" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="170" y="274" text-anchor="middle" font-size="13" fill="#374151">TS 7.0 (Go) — только CLI</text>
  <text x="170" y="293" text-anchor="middle" font-size="12" fill="#374151">можно лишь tsc --noEmit в CI</text>

  <!-- right column: plan -->
  <text x="510" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">План (TS 7.1 + Oxc)</text>
  <rect x="380" y="78" width="260" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="510" y="102" text-anchor="middle" font-size="13" fill="#374151">Angular compiler</text>
  <text x="510" y="121" text-anchor="middle" font-size="12" fill="#374151">две независимые ветки</text>
  <line x1="450" y1="134" x2="450" y2="164" stroke="#6b7280" stroke-width="2"/>
  <polygon points="444,160 456,160 450,170" fill="#6b7280"/>
  <line x1="570" y1="134" x2="570" y2="164" stroke="#6b7280" stroke-width="2"/>
  <polygon points="564,160 576,160 570,170" fill="#6b7280"/>
  <rect x="380" y="172" width="125" height="72" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="442" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Oxc (Rust)</text>
  <text x="442" y="214" text-anchor="middle" font-size="11" fill="#374151">парсинг и</text>
  <text x="442" y="230" text-anchor="middle" font-size="11" fill="#374151">трансформ кода</text>
  <rect x="515" y="172" width="125" height="72" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="577" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">TS 7.1 (Go)</text>
  <text x="577" y="214" text-anchor="middle" font-size="11" fill="#374151">type-check кода</text>
  <text x="577" y="230" text-anchor="middle" font-size="11" fill="#374151">и шаблонов</text>
  <line x1="442" y1="244" x2="442" y2="268" stroke="#6b7280" stroke-width="2"/>
  <line x1="577" y1="244" x2="577" y2="268" stroke="#6b7280" stroke-width="2"/>
  <rect x="380" y="268" width="260" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="510" y="293" text-anchor="middle" font-size="12" fill="#374151">бандл (Vite/esbuild) + ошибки типов</text>

  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#4b5563">В TS 7.1 есть API для анализа (snapshots, sync/async клиенты), но нет transformer API,</text>
  <text x="340" y="370" text-anchor="middle" font-size="12" fill="#4b5563">поэтому трансформацию Angular переносит в Oxc. Сроки: RC 10.11, stable 24.11.2026.</text>
</svg>
