<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Агент в команде: где стоят ограждения</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>

  <rect x="20" y="70" width="120" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="80" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Задача</text>
  <text x="80" y="120" text-anchor="middle" font-size="11" fill="#374151">тикет с критериями</text>
  <text x="80" y="136" text-anchor="middle" font-size="11" fill="#374151">приёмки</text>

  <rect x="165" y="70" width="130" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Контекст</text>
  <text x="230" y="120" text-anchor="middle" font-size="11" fill="#374151">AGENTS.md, правила,</text>
  <text x="230" y="136" text-anchor="middle" font-size="11" fill="#374151">Angular MCP</text>

  <rect x="320" y="70" width="130" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="385" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Агент</text>
  <text x="385" y="120" text-anchor="middle" font-size="11" fill="#374151">ветка + песочница,</text>
  <text x="385" y="136" text-anchor="middle" font-size="11" fill="#374151">без прод-секретов</text>

  <rect x="475" y="70" width="105" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="527" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">CI</text>
  <text x="527" y="120" text-anchor="middle" font-size="11" fill="#374151">lint, типы,</text>
  <text x="527" y="136" text-anchor="middle" font-size="11" fill="#374151">тесты, SAST</text>

  <rect x="600" y="70" width="105" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="652" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Человек</text>
  <text x="652" y="120" text-anchor="middle" font-size="11" fill="#374151">ревью и</text>
  <text x="652" y="136" text-anchor="middle" font-size="11" fill="#374151">ответственность</text>

  <line x1="140" y1="110" x2="162" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="295" y1="110" x2="317" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="110" x2="472" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="110" x2="597" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <path d="M527,150 C527,200 385,200 385,155" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="456" y="205" text-anchor="middle" font-size="11" fill="#b91c1c">красный CI → агент чинит сам</text>
  <path d="M652,150 C652,240 230,240 230,155" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="252" text-anchor="middle" font-size="11" fill="#1d4ed8">повторяющаяся ошибка в ревью → правило в AGENTS.md</text>

  <rect x="20" y="280" width="685" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="36" y="302" font-size="12" font-weight="700" fill="#991b1b">Главные риски:</text>
  <text x="36" y="322" font-size="12" fill="#374151">утечка секретов · prompt injection из issue/доков · выдуманные пакеты · огромные PR · «никто не понимает код»</text>
  <text x="36" y="338" font-size="12" fill="#374151">Ограждения ловят первые три, лимит размера PR и ревью — последние два.</text>
</svg>
