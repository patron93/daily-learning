<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Запрос в NestJS: кто за что отвечает</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>

  <text x="20" y="62" font-size="12" font-weight="700" fill="#6b7280">NestJS</text>

  <rect x="20" y="72" width="96" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="68" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Middleware</text>
  <text x="68" y="120" text-anchor="middle" font-size="10" fill="#374151">cors, cookies,</text>
  <text x="68" y="133" text-anchor="middle" font-size="10" fill="#374151">raw req/res</text>

  <rect x="130" y="72" width="96" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="178" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Guard</text>
  <text x="178" y="120" text-anchor="middle" font-size="10" fill="#374151">пускать ли?</text>
  <text x="178" y="133" text-anchor="middle" font-size="10" fill="#374151">auth, роли</text>

  <rect x="240" y="72" width="106" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="293" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Interceptor ↓</text>
  <text x="293" y="120" text-anchor="middle" font-size="10" fill="#374151">логи, кеш,</text>
  <text x="293" y="133" text-anchor="middle" font-size="10" fill="#374151">timeout (RxJS)</text>

  <rect x="360" y="72" width="96" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="408" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Pipe</text>
  <text x="408" y="120" text-anchor="middle" font-size="10" fill="#374151">валидация,</text>
  <text x="408" y="133" text-anchor="middle" font-size="10" fill="#374151">преобразование</text>

  <rect x="470" y="72" width="106" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="523" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Handler</text>
  <text x="523" y="120" text-anchor="middle" font-size="10" fill="#374151">метод контроллера</text>
  <text x="523" y="133" text-anchor="middle" font-size="10" fill="#374151">→ сервисы</text>

  <rect x="590" y="72" width="150" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="665" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Interceptor ↑</text>
  <text x="665" y="120" text-anchor="middle" font-size="10" fill="#374151">map ответа,</text>
  <text x="665" y="133" text-anchor="middle" font-size="10" fill="#374151">catchError</text>

  <line x1="116" y1="107" x2="128" y2="107" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="226" y1="107" x2="238" y2="107" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="346" y1="107" x2="358" y2="107" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="456" y1="107" x2="468" y2="107" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="576" y1="107" x2="588" y2="107" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <rect x="240" y="168" width="500" height="36" rx="10" fill="#fce7f3" stroke="#db2777"/>
  <text x="490" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#831843">Exception filter: исключение из любого шага → HTTP-ответ со статусом</text>
  <path d="M178,142 L178,186 L238,186" fill="none" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <text x="20" y="238" font-size="12" font-weight="700" fill="#6b7280">Аналог в Angular</text>
  <text x="68" y="262" text-anchor="middle" font-size="11" fill="#374151">—</text>
  <text x="178" y="262" text-anchor="middle" font-size="11" fill="#374151">CanActivate</text>
  <text x="293" y="262" text-anchor="middle" font-size="11" fill="#374151">HttpInterceptor</text>
  <text x="408" y="262" text-anchor="middle" font-size="11" fill="#374151">Validators</text>
  <text x="523" y="262" text-anchor="middle" font-size="11" fill="#374151">компонент</text>
  <text x="665" y="262" text-anchor="middle" font-size="11" fill="#374151">HttpInterceptor</text>

  <rect x="20" y="282" width="720" height="34" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="380" y="304" text-anchor="middle" font-size="12" fill="#7c2d12">Главное отличие: @Injectable по умолчанию один на весь процесс и на всех пользователей, а не на вкладку браузера</text>
</svg>
