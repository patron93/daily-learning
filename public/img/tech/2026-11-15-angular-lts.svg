<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Arial, sans-serif">
<rect width="780" height="330" fill="#ffffff" rx="16"/>
<text x="390" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Окна поддержки Angular: старый и новый ритм</text>
<g font-size="12" fill="#4b5563" text-anchor="middle">
<text x="130" y="62">2025</text><text x="290" y="62">2026</text><text x="450" y="62">2027</text><text x="610" y="62">2028</text>
</g>
<g stroke="#e5e7eb"><line x1="130" y1="70" x2="130" y2="270"/><line x1="290" y1="70" x2="290" y2="270"/><line x1="450" y1="70" x2="450" y2="270"/><line x1="610" y1="70" x2="610" y2="270"/></g>
<!-- scale: 160px per year, x(2025-01)=130 -->
<text x="40" y="100" font-size="14" font-weight="bold" fill="#111827">v20</text>
<rect x="196" y="86" width="78" height="22" fill="#60a5fa"/><rect x="274" y="86" width="162" height="22" fill="#fdba74"/>
<text x="442" y="102" font-size="12" fill="#b91c1c" font-weight="bold">EOL 28.11.2026</text>
<text x="40" y="140" font-size="14" font-weight="bold" fill="#111827">v21</text>
<rect x="276" y="126" width="80" height="22" fill="#60a5fa"/><rect x="356" y="126" width="161" height="22" fill="#fdba74"/>
<text x="40" y="180" font-size="14" font-weight="bold" fill="#111827">v22</text>
<rect x="357" y="166" width="160" height="22" fill="#60a5fa"/><rect x="517" y="166" width="160" height="22" fill="#fdba74"/>
<text x="604" y="200" font-size="11" fill="#374151" text-anchor="middle">24 мес.: 12 active + 12 LTS</text>
<text x="40" y="230" font-size="14" font-weight="bold" fill="#111827">v23</text>
<rect x="517" y="216" width="200" height="22" fill="#60a5fa" opacity="0.5" stroke="#2563eb" stroke-dasharray="4 3"/>
<text x="530" y="256" font-size="11" fill="#374151">≈ июнь 2027 (план)</text>
<!-- today -->
<line x1="429" y1="72" x2="429" y2="275" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="429" y="290" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">сегодня, 15.11.2026</text>
<rect x="110" y="300" width="14" height="14" fill="#60a5fa"/><text x="130" y="312" font-size="12" fill="#374151">active</text>
<rect x="190" y="300" width="14" height="14" fill="#fdba74"/><text x="210" y="312" font-size="12" fill="#374151">LTS (только критические и security-фиксы)</text>
</svg>
