<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="system-ui, sans-serif">
  <rect width="780" height="360" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Три паттерна: что они прячут от компонента</text>

  <!-- Strategy -->
  <text x="130" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Strategy</text>
  <text x="130" y="80" text-anchor="middle" font-size="11" fill="#6b7280">«как» выбирается извне</text>
  <rect x="55" y="94" width="150" height="44" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="130" y="121" text-anchor="middle" font-size="12" fill="#1e3a8a">ExportService</text>
  <line x1="130" y1="138" x2="130" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="138" y="160" font-size="10" fill="#6b7280">EXPORTERS (multi)</text>
  <rect x="20" y="176" width="66" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="53" y="199" text-anchor="middle" font-size="11" fill="#1e3a8a">CSV</text>
  <rect x="97" y="176" width="66" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="130" y="199" text-anchor="middle" font-size="11" fill="#1e3a8a">XLSX</text>
  <rect x="174" y="176" width="66" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="207" y="199" text-anchor="middle" font-size="11" fill="#1e3a8a">PDF</text>
  <text x="130" y="244" text-anchor="middle" font-size="11" fill="#374151">один интерфейс,</text>
  <text x="130" y="259" text-anchor="middle" font-size="11" fill="#374151">взаимозаменяемые реализации</text>

  <!-- Facade -->
  <text x="390" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">Facade</text>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#6b7280">«сколько» всего за ним</text>
  <rect x="315" y="94" width="150" height="44" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text x="390" y="121" text-anchor="middle" font-size="12" fill="#064e3b">CartFacade</text>
  <line x1="390" y1="138" x2="390" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="280" y="176" width="66" height="36" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="313" y="199" text-anchor="middle" font-size="11" fill="#064e3b">Store</text>
  <rect x="357" y="176" width="66" height="36" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="390" y="199" text-anchor="middle" font-size="11" fill="#064e3b">API</text>
  <rect x="434" y="176" width="66" height="36" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="467" y="199" text-anchor="middle" font-size="11" fill="#064e3b">Analytics</text>
  <text x="390" y="244" text-anchor="middle" font-size="11" fill="#374151">узкий API сценария</text>
  <text x="390" y="259" text-anchor="middle" font-size="11" fill="#374151">поверх нескольких подсистем</text>

  <!-- Adapter -->
  <text x="650" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Adapter</text>
  <text x="650" y="80" text-anchor="middle" font-size="11" fill="#6b7280">«чужая форма» снаружи</text>
  <rect x="575" y="94" width="150" height="44" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="650" y="114" text-anchor="middle" font-size="12" fill="#78350f">наш интерфейс</text>
  <text x="650" y="129" text-anchor="middle" font-size="10" fill="#78350f">Order (домен)</text>
  <line x1="650" y1="138" x2="650" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="658" y="160" font-size="10" fill="#6b7280">mapOrder()</text>
  <rect x="575" y="176" width="150" height="36" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="650" y="199" text-anchor="middle" font-size="11" fill="#78350f">OrderDto / SDK вендора</text>
  <text x="650" y="244" text-anchor="middle" font-size="11" fill="#374151">переводит один интерфейс</text>
  <text x="650" y="259" text-anchor="middle" font-size="11" fill="#374151">в другой, без новой логики</text>

  <rect x="20" y="290" width="740" height="52" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="390" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Уже в Angular: TitleStrategy, RouteReuseStrategy, PreloadingStrategy · ControlValueAccessor, DateAdapter</text>
  <text x="390" y="331" text-anchor="middle" font-size="11" fill="#4b5563">Анти-сигнал: фасад, который просто проксирует один сервис, — лишний слой, а не паттерн</text>
</svg>
