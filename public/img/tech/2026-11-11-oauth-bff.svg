<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif">
<rect width="760" height="400" fill="#fffdf7" rx="16"/>
<text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">RFC 10017: где живут токены</text>
<g font-size="13" fill="#111827">
<rect x="20" y="56" width="230" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="135" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">1. BFF</text>
<text x="135" y="100" text-anchor="middle" font-size="12" fill="#15803d">рекомендуется</text>
<rect x="45" y="116" width="180" height="34" rx="8" fill="#fff" stroke="#16a34a"/><text x="135" y="138" text-anchor="middle">Angular SPA</text>
<text x="135" y="170" text-anchor="middle" font-size="12">↕ cookie HttpOnly</text>
<rect x="45" y="180" width="180" height="34" rx="8" fill="#fff" stroke="#16a34a"/><text x="135" y="202" text-anchor="middle">BFF 🔑 токены здесь</text>
<text x="135" y="234" text-anchor="middle" font-size="12">↕ access token</text>
<rect x="45" y="244" width="180" height="34" rx="8" fill="#fff" stroke="#16a34a"/><text x="135" y="266" text-anchor="middle">API</text>
<text x="135" y="306" text-anchor="middle" fill="#15803d">XSS не украдёт токен</text>
<text x="135" y="326" text-anchor="middle" fill="#b91c1c">нужна защита от CSRF</text>

<rect x="265" y="56" width="230" height="300" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="380" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#713f12">2. Token-mediating</text>
<text x="380" y="100" text-anchor="middle" font-size="12" fill="#a16207">если проксировать нельзя</text>
<rect x="290" y="116" width="180" height="34" rx="8" fill="#fff" stroke="#ca8a04"/><text x="380" y="138" text-anchor="middle">SPA 🔑 access token</text>
<text x="380" y="170" text-anchor="middle" font-size="12">↕ cookie</text>
<rect x="290" y="180" width="180" height="34" rx="8" fill="#fff" stroke="#ca8a04"/><text x="380" y="202" text-anchor="middle">Backend (получает токены)</text>
<rect x="290" y="244" width="180" height="34" rx="8" fill="#fff" stroke="#ca8a04"/><text x="380" y="266" text-anchor="middle">API ← SPA напрямую</text>
<text x="380" y="306" text-anchor="middle" fill="#15803d">refresh-токен не в браузере</text>
<text x="380" y="326" text-anchor="middle" fill="#b91c1c">access token виден JS</text>

<rect x="510" y="56" width="230" height="300" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="625" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">3. Браузерный клиент</text>
<text x="625" y="100" text-anchor="middle" font-size="12" fill="#b91c1c">наименее безопасно</text>
<rect x="535" y="116" width="180" height="34" rx="8" fill="#fff" stroke="#dc2626"/><text x="625" y="138" text-anchor="middle">SPA 🔑 все токены</text>
<text x="625" y="170" text-anchor="middle" font-size="12">PKCE S256 обязателен</text>
<rect x="535" y="180" width="180" height="34" rx="8" fill="#fff" stroke="#dc2626"/><text x="625" y="202" text-anchor="middle">IdP (public client)</text>
<rect x="535" y="244" width="180" height="34" rx="8" fill="#fff" stroke="#dc2626"/><text x="625" y="266" text-anchor="middle">API ← SPA напрямую</text>
<text x="625" y="306" text-anchor="middle" fill="#15803d">нет своего бэкенда</text>
<text x="625" y="326" text-anchor="middle" fill="#b91c1c">ротация refresh / DPoP</text>
</g>
<text x="380" y="385" text-anchor="middle" font-size="12" fill="#4b5563">Implicit и password grant — устаревшие паттерны во всех трёх случаях</text>
</svg>
