<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Arial, sans-serif">
  <rect width="680" height="360" fill="#fdfcf7" rx="16"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Code review: горлышко против сети</text>
