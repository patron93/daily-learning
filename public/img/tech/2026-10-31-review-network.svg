  <g stroke="#16a34a" stroke-width="1.5">
    <line x1="434" y1="176" x2="481" y2="164"/><line x1="529" y1="164" x2="576" y2="176"/>
    <line x1="420" y1="202" x2="445" y2="223"/><line x1="590" y1="202" x2="567" y2="223"/>
    <line x1="479" y1="245" x2="531" y2="245"/><line x1="505" y1="184" x2="465" y2="222"/>
  </g>
