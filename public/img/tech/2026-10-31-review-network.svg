  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="40" y="95" width="60" height="28" rx="6" fill="#fff" stroke="#9ca3af"/><text x="70" y="114">PR 1</text>
    <rect x="40" y="135" width="60" height="28" rx="6" fill="#fff" stroke="#9ca3af"/><text x="70" y="154">PR 2</text>
    <rect x="40" y="175" width="60" height="28" rx="6" fill="#fff" stroke="#9ca3af"/><text x="70" y="194">PR 3</text>
