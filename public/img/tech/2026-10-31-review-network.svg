  <text x="505" y="110" text-anchor="middle" font-size="13" fill="#1e1b4b">CI: lint · prettier · тесты · бандл</text>
  <g font-size="13" text-anchor="middle" fill="#111827">
    <circle cx="410" cy="180" r="24" fill="#bbf7d0" stroke="#15803d"/><text x="410" y="185">Ania</text>
    <circle cx="505" cy="160" r="24" fill="#bbf7d0" stroke="#15803d"/><text x="505" y="165">Piotr</text>
    <circle cx="600" cy="180" r="24" fill="#bbf7d0" stroke="#15803d"/><text x="600" y="185">Ola</text>
    <circle cx="455" cy="245" r="24" fill="#bbf7d0" stroke="#15803d"/><text x="455" y="250">Kuba</text>
    <circle cx="555" cy="245" r="24" fill="#86efac" stroke="#15803d" stroke-width="2"/><text x="555" y="250" font-weight="bold">TL</text>
