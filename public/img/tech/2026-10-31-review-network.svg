  </g>
  <g stroke="#dc2626" stroke-width="2">
    <line x1="100" y1="109" x2="200" y2="185"/><line x1="100" y1="149" x2="200" y2="187"/>
    <line x1="100" y1="189" x2="200" y2="189"/><line x1="100" y1="229" x2="200" y2="191"/>
    <line x1="100" y1="269" x2="200" y2="193"/>
  </g>
  <circle cx="240" cy="189" r="38" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <text x="240" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">TL</text>
  <text x="175" y="306" text-anchor="middle" font-size="13" fill="#7f1d1d">очередь 2 дня, PR по 1500 строк,</text>
  <text x="175" y="324" text-anchor="middle" font-size="13" fill="#7f1d1d">знания у одного человека</text>
  <!-- right -->
  <rect x="350" y="50" width="310" height="290" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="505" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">✅ Сеть ревьюеров</text>
