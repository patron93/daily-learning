<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="800" height="380" rx="14" fill="#f8fafc"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Web Install API: от клика до установки</text>
  <rect x="20" y="60" width="170" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="105" y="86" text-anchor="middle" font-weight="700" fill="#3730a3">Клик пользователя</text>
  <text x="105" y="106" text-anchor="middle" fill="#3730a3">user activation</text>
  <rect x="230" y="50" width="200" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="330" y="73" text-anchor="middle" fill="#166534">элемент install (браузер)</text>
  <rect x="230" y="96" width="200" height="36" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="330" y="119" text-anchor="middle" fill="#854d0e">navigator.install(опции)</text>
  <path d="M190 90 H226" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="50" width="310" height="90" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="625" y="72" text-anchor="middle" font-weight="700" fill="#0f172a">Проверки манифеста</text>
  <text x="485" y="94" fill="#334155">• HTTPS, без редиректов, JSON-тип</text>
  <text x="485" y="113" fill="#334155">• id (для текущего — обязателен)</text>
  <text x="485" y="132" fill="#334155">• start_url того же origin</text>
  <path d="M430 91 H466" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="170" width="310" height="56" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="625" y="194" text-anchor="middle" font-weight="700" fill="#075985">Диалог браузера</text>
  <text x="625" y="214" text-anchor="middle" fill="#075985">(для чужого app — ещё и permission)</text>
  <path d="M625 140 V166" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="256" width="95" height="44" rx="8" fill="#dcfce7"/><text x="517" y="283" text-anchor="middle" fill="#166534">success</text>
  <rect x="577" y="256" width="95" height="44" rx="8" fill="#fee2e2"/><text x="624" y="283" text-anchor="middle" fill="#991b1b">AbortError</text>
  <rect x="684" y="256" width="96" height="44" rx="8" fill="#ffedd5"/><text x="732" y="283" text-anchor="middle" fill="#9a3412">DataError</text>
  <path d="M625 226 V252" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="20" y="170" width="410" height="186" rx="10" fill="#fff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="225" y="196" text-anchor="middle" font-weight="700" fill="#0f172a">Прогрессивное улучшение</text>
  <text x="38" y="224" fill="#334155">1. Navigator.prototype.install есть → кнопка + install()</text>
  <text x="38" y="250" fill="#334155">2. нет, но пришёл beforeinstallprompt → prompt()</text>
  <text x="58" y="270" fill="#64748b">(только текущее приложение, одноразово)</text>
  <text x="38" y="296" fill="#334155">3. ничего нет → ссылка «Как установить»</text>
  <text x="38" y="330" fill="#64748b">SSR: проверять только в браузере (isPlatformBrowser)</text>
  <text x="625" y="330" text-anchor="middle" fill="#64748b">Chromium: Chrome / Edge 158+</text>
</svg>
