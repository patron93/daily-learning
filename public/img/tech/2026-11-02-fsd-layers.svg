<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Arial, sans-serif">
  <rect width="680" height="400" fill="#f8fafc" rx="16"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">FSD: слои, слайсы и направление импортов</text>
  <g font-size="15">
    <rect x="40" y="52" width="420" height="40" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="56" y="77" fill="#312e81" font-weight="bold">app</text><text x="160" y="77" fill="#334155">app.config.ts, app.routes.ts</text>
    <rect x="40" y="100" width="420" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="56" y="125" fill="#1e3a8a" font-weight="bold">pages</text><text x="160" y="125" fill="#334155">order-details · cart · profile</text>
    <rect x="40" y="148" width="420" height="40" rx="8" fill="#cffafe" stroke="#0891b2"/>
    <text x="56" y="173" fill="#164e63" font-weight="bold">widgets</text><text x="160" y="173" fill="#334155">header · order-history</text>
    <rect x="40" y="196" width="420" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="56" y="221" fill="#14532d" font-weight="bold">features</text><text x="160" y="221" fill="#334155">cart-add · order-repeat · auth-login</text>
    <rect x="40" y="244" width="420" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="56" y="269" fill="#713f12" font-weight="bold">entities</text><text x="160" y="269" fill="#334155">user · order · product</text>
    <rect x="40" y="292" width="420" height="40" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="56" y="317" fill="#1e293b" font-weight="bold">shared</text><text x="160" y="317" fill="#334155">ui-kit · http · lib (без домена)</text>
  </g>
  <line x1="480" y1="70" x2="480" y2="312" stroke="#16a34a" stroke-width="4"/>
  <polygon points="470,306 490,306 480,326" fill="#16a34a"/>
  <text x="496" y="160" font-size="14" fill="#15803d" font-weight="bold">импорт только</text>
  <text x="496" y="178" font-size="14" fill="#15803d" font-weight="bold">вниз ✅</text>
  <text x="496" y="222" font-size="13" fill="#b91c1c">features/a → features/b ❌</text>
  <text x="496" y="242" font-size="13" fill="#b91c1c">entities → features ❌</text>
  <text x="496" y="262" font-size="13" fill="#b45309">entities/user/@x/order</text>
  <text x="496" y="280" font-size="13" fill="#b45309">— явный кросс-импорт</text>
  <rect x="40" y="346" width="600" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="371" font-size="14" fill="#334155">Слайс = ui / model / api / lib + index.ts (публичный API). Снаружи — только через index.ts</text>
</svg>
