<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial, sans-serif">
<rect width="800" height="420" fill="#fafafa" rx="16"/>
<text x="200" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Квадрант долга (Фаулер)</text>
<text x="130" y="60" text-anchor="middle" font-size="13" fill="#4b5563">безрассудный</text>
<text x="290" y="60" text-anchor="middle" font-size="13" fill="#4b5563">разумный</text>
<text x="22" y="140" font-size="13" fill="#4b5563" transform="rotate(-90 22 140)" text-anchor="middle">осознанный</text>
<text x="22" y="280" font-size="13" fill="#4b5563" transform="rotate(-90 22 280)" text-anchor="middle">неосознанный</text>
<rect x="45" y="72" width="170" height="135" rx="10" fill="#fee2e2"/>
<text x="130" y="120" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">«Нет времени</text>
<text x="130" y="140" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">на дизайн»</text>
<text x="130" y="175" text-anchor="middle" font-size="12" fill="#7f1d1d">→ границы и ревью</text>
<rect x="225" y="72" width="170" height="135" rx="10" fill="#dcfce7"/>
<text x="310" y="112" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">«Выпустим сейчас,</text>
<text x="310" y="132" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">починим потом»</text>
<text x="310" y="167" text-anchor="middle" font-size="12" fill="#14532d">→ кредит с графиком</text>
<text x="310" y="185" text-anchor="middle" font-size="12" fill="#14532d">платежей</text>
<rect x="45" y="217" width="170" height="135" rx="10" fill="#ffedd5"/>
<text x="130" y="265" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="bold">«Что такое</text>
<text x="130" y="285" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="bold">слои?»</text>
<text x="130" y="320" text-anchor="middle" font-size="12" fill="#7c2d12">→ обучение, не рефакторинг</text>
<rect x="225" y="217" width="170" height="135" rx="10" fill="#dbeafe"/>
<text x="310" y="257" text-anchor="middle" font-size="14" fill="#1e40af" font-weight="bold">«Теперь знаем,</text>
<text x="310" y="277" text-anchor="middle" font-size="14" fill="#1e40af" font-weight="bold">как надо было»</text>
<text x="310" y="312" text-anchor="middle" font-size="12" fill="#1e3a8a">→ нормальное устаревание,</text>
<text x="310" y="330" text-anchor="middle" font-size="12" fill="#1e3a8a">реестр и бюджет</text>
<text x="600" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Питч бизнесу: 5 шагов</text>
<g font-size="14">
<rect x="440" y="52" width="330" height="48" rx="10" fill="#e0e7ff"/><text x="460" y="81" fill="#111827"><tspan font-weight="bold">1 Симптом:</tspan> checkout в 2× дольше</text>
<rect x="440" y="110" width="330" height="48" rx="10" fill="#e0e7ff"/><text x="460" y="139" fill="#111827"><tspan font-weight="bold">2 Причина</tspan> одной фразой без жаргона</text>
<rect x="440" y="168" width="330" height="48" rx="10" fill="#fef3c7"/><text x="460" y="197" fill="#111827"><tspan font-weight="bold">3 Проценты:</tspan> часы/спринт, инциденты</text>
<rect x="440" y="226" width="330" height="48" rx="10" fill="#dcfce7"/><text x="460" y="255" fill="#111827"><tspan font-weight="bold">4 Предложение</tspan> + метрика успеха</text>
<rect x="440" y="284" width="330" height="48" rx="10" fill="#dcfce7"/><text x="460" y="313" fill="#111827"><tspan font-weight="bold">5 Связь</tspan> с роадмапом бизнеса</text>
</g>
<text x="605" y="368" text-anchor="middle" font-size="13" fill="#374151">дорогой долг = плохо × часто меняется</text>
<text x="400" y="400" text-anchor="middle" font-size="12" fill="#6b7280">долг в коде, который никто не трогает, почти бесплатен</text>
</svg>
