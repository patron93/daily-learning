<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif">
  <rect width="760" height="400" fill="#fbfaf6" rx="12"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">N+1 против батча · порядок колонок в индексе</text>
  <!-- N+1 -->
  <text x="190" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">❌ N+1: 51 round-trip</text>
  <rect x="30" y="74" width="80" height="200" rx="8" fill="#e3f0fb" stroke="#1f5fa8"/>
  <text x="70" y="178" text-anchor="middle" font-size="13" fill="#1f5fa8">API</text>
  <rect x="270" y="74" width="80" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="310" y="178" text-anchor="middle" font-size="13" fill="#2e7d32">Postgres</text>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="110" y1="90" x2="270" y2="90"/>
    <line x1="110" y1="112" x2="270" y2="112"/><line x1="110" y1="128" x2="270" y2="128"/>
    <line x1="110" y1="144" x2="270" y2="144"/><line x1="110" y1="160" x2="270" y2="160"/>
    <line x1="110" y1="176" x2="270" y2="176"/><line x1="110" y1="192" x2="270" y2="192"/>
    <line x1="110" y1="208" x2="270" y2="208"/><line x1="110" y1="224" x2="270" y2="224"/>
    <line x1="110" y1="240" x2="270" y2="240"/><line x1="110" y1="256" x2="270" y2="256"/>
  </g>
  <circle r="5" fill="#c0392b"><animateMotion dur="0.6s" repeatCount="indefinite" path="M110 176 L270 176"/></circle>
  <text x="190" y="86" text-anchor="middle" font-size="11" fill="#333">orders (1)</text>
  <text x="190" y="296" text-anchor="middle" font-size="12" fill="#333">+ customer × 50, по 2 мс → ~100 мс</text>
  <!-- batch -->
  <text x="570" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">✅ батч / join: 2 round-trip</text>
  <rect x="410" y="74" width="80" height="200" rx="8" fill="#e3f0fb" stroke="#1f5fa8"/>
  <text x="450" y="178" text-anchor="middle" font-size="13" fill="#1f5fa8">API</text>
  <rect x="650" y="74" width="80" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="690" y="178" text-anchor="middle" font-size="13" fill="#2e7d32">Postgres</text>
  <g stroke="#2e7d32" stroke-width="3">
    <line x1="490" y1="120" x2="650" y2="120"/>
    <line x1="490" y1="200" x2="650" y2="200"/>
  </g>
  <circle r="6" fill="#2e7d32"><animateMotion dur="1.2s" repeatCount="indefinite" path="M490 200 L650 200"/></circle>
  <text x="570" y="112" text-anchor="middle" font-size="11" fill="#333">orders LIMIT 50</text>
  <text x="570" y="192" text-anchor="middle" font-size="11" fill="#333">customers WHERE id = ANY(ids)</text>
  <text x="570" y="296" text-anchor="middle" font-size="12" fill="#333">не зависит от размера страницы</text>
  <!-- index order -->
  <rect x="30" y="316" width="700" height="66" rx="10" fill="#fff" stroke="#bbb"/>
  <text x="50" y="340" font-size="14" font-weight="bold" fill="#222">Индекс (tenant_id, status, created_at DESC)</text>
  <text x="50" y="364" font-size="13" fill="#2e7d32">✔ tenant = 42 AND status = 'open' ORDER BY created_at</text>
  <text x="440" y="364" font-size="13" fill="#c0392b">✘ только WHERE created_at &gt; …</text>
</svg>
